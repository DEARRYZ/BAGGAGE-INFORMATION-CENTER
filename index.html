<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFS Baggage Service Information Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14202e;--mut:#5f6f82;--line:#dbe3ec;--pri:#0b4f8a;--pri2:#0e6fc0;--accent:#e8a317;--ok:#1d8a4e;--warn:#c47f00;--bad:#c0392b;--soft:#e8f1fa;--shadow:0 2px 10px rgba(20,32,46,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--card:#17212d;--ink:#e6edf5;--mut:#92a3b6;--line:#2a3849;--pri:#5aa7ec;--pri2:#7ab8f0;--soft:#1c2c3f;--shadow:0 2px 10px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e151d;--card:#17212d;--ink:#e6edf5;--mut:#92a3b6;--line:#2a3849;--pri:#5aa7ec;--pri2:#7ab8f0;--soft:#1c2c3f;--shadow:0 2px 10px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px}
textarea{resize:vertical;min-height:70px}
header{background:linear-gradient(120deg,#07345e,#0b4f8a 60%,#0e6fc0);color:#fff;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1500px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand .logo{font-size:26px}.brand b{font-size:17px;display:block;line-height:1.15}.brand small{opacity:.8;font-size:12px}
.vtag{background:rgba(255,255,255,.18);border-radius:20px;padding:1px 9px;font-size:12px;margin-left:6px}
.gsearch{flex:1;min-width:240px;position:relative}
.gsearch input{background:#fff;color:#14202e;border:none;padding:10px 14px 10px 38px;border-radius:24px;font-size:15px}
.gsearch .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#5f6f82;pointer-events:none}
.gsearch label{position:absolute;top:-9px;left:16px;font-size:10px;background:var(--accent);color:#2b1d00;padding:0 7px;border-radius:8px;font-weight:700;letter-spacing:.3px}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.3);max-height:70vh;overflow:auto;display:none;z-index:50;border:1px solid var(--line)}
.gres.on{display:block}
.gres .gh{padding:8px 14px;font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.gres .it{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.gres .it:hover,.gres .it.act{background:var(--soft)}
.gres .it .t{font-weight:600}.gres .it .s{font-size:13px;color:var(--mut)}
.gres mark{background:#ffe08a;color:#000;border-radius:3px;padding:0 1px}
.src{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--pri);color:#fff;margin-right:6px;vertical-align:1px}
.src.s-policy{background:#7b4fb3}.src.s-contact{background:#1d8a4e}
.crumb{font-size:12px;color:var(--mut)}
nav.bar{max-width:1500px;margin:12px auto 0;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.bar .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav.bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.bar select{width:auto;padding:5px 9px}
main{max-width:1500px;margin:14px auto 80px;padding:0 18px;position:relative;min-height:60vh}
#dz{position:absolute;inset:0 18px;z-index:25;display:grid;grid-template-columns:1fr 1fr;gap:16px;background:rgba(11,79,138,.14);border-radius:16px}
@media(max-width:1000px){#dz{grid-template-columns:1fr}}
.dzone{border:3px dashed var(--pri2);border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--pri);text-align:center;padding:20px;min-height:140px}
.dzone small{font-weight:400;color:var(--mut);font-size:13px}
.dzone.over{background:var(--pri);color:#fff;border-style:solid}.dzone.over small{color:#dbe9f7}
[data-s][draggable=true]{cursor:grab}
.hint{font-size:12px;color:var(--mut)}
.sfbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin:8px 0}.sfbar small{display:block;font-size:11px;color:var(--mut)}
@container (max-width:760px){.sfbar{grid-template-columns:1fr 1fr}.sfbar>:first-child{grid-column:1/-1}}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;display:block}.nothumb{display:flex;align-items:center;justify-content:center;background:var(--soft);cursor:default;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--line);margin-right:6px}
.st-SPending{background:#dcebfb;color:#0b4f8a}.st-SForwarded{background:#fde2e0;color:#a52a1f}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}.swatch.on{outline:3px solid var(--pri2);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut)}#s-up{cursor:pointer}
.hentry{border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:13.5px}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:12px}.pager .pgd{color:var(--mut)}
.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{border-color:var(--line);color:inherit}
.grid,.tw{scroll-margin-top:150px}
.src.s-sorting{background:#c47f00}
.sync{font-size:12px;border-radius:14px;padding:3px 10px;background:rgba(255,255,255,.18);color:#fff;border:none}
.sync.synced{background:#1d8a4e}.sync.offline{background:#c47f00}.sync.error{background:#c0392b}
.hero{background:var(--card);border-radius:18px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--mut);max-width:640px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--soft);border-radius:12px;padding:10px 18px;min-width:110px;text-align:center}.kpi b{font-size:24px;display:block;color:var(--pri)}.kpi span{font-size:12px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scard{background:var(--card);border:2px solid transparent;border-radius:18px;padding:26px 22px;box-shadow:var(--shadow);text-align:left;transition:.18s;display:block;width:100%}
.scard:hover{border-color:var(--pri2);transform:translateY(-3px)}
.scard .i{font-size:40px}.scard h3{margin:8px 0 4px;font-size:20px}.scard p{margin:0;color:var(--mut);font-size:14px}
.scard .go{margin-top:14px;color:var(--pri);font-weight:600}
.scard.add{border:2px dashed var(--line);box-shadow:none;background:transparent;cursor:default;color:var(--mut);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.scard.add:hover{transform:none;border-color:var(--line)}
.soon{display:inline-block;background:var(--accent);color:#2b1d00;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.pane{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0;container-type:inline-size}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0;font-size:20px}.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 14px;font-weight:600}.seg button.on{background:var(--pri);color:#fff}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:10px}
@container (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
.meta{color:var(--mut);font-size:13px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:.15s}
.tcard:hover{border-color:var(--pri2);box-shadow:var(--shadow)}
.tcard h4{margin:0;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.tcard .subj{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:10px;background:var(--soft);color:var(--pri);margin:0 4px 3px 0}
.chip.al{background:#fff1d6;color:#7a4f00}.chip.au{background:#e6f5ec;color:#16653a}.chip.ty{background:var(--soft)}.chip.tr{background:#fde8e5;color:#9b2c1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.al{background:#3a2d0e;color:#f0c55e}:root:not([data-theme="light"]) .chip.au{background:#123422;color:#7bd6a0}:root:not([data-theme="light"]) .chip.tr{background:#3b1a16;color:#f0a79e}}
:root[data-theme="dark"] .chip.al{background:#3a2d0e;color:#f0c55e}:root[data-theme="dark"] .chip.au{background:#123422;color:#7bd6a0}:root[data-theme="dark"] .chip.tr{background:#3b1a16;color:#f0a79e}
.modalbg{position:fixed;inset:0;background:rgba(5,12,20,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--card);border-radius:16px;max-width:820px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h3{margin:0 0 4px}
.mhead{display:flex;gap:10px;align-items:flex-start}.mhead .x{margin-left:auto}
.body{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14.5px;overflow-wrap:anywhere;max-height:52vh;overflow:auto}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px;display:flex;align-items:center;gap:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .full{grid-column:1/-1}
@media(max-width:600px){.fg{grid-template-columns:1fr}}
.fg label{font-size:12.5px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
.note{background:#fff7e0;border:1px solid #f0d78a;color:#6b4a00;border-radius:9px;padding:7px 11px;font-size:13px;margin:8px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{background:#3a2f12;border-color:#6b5517;color:#f2d68a}}
:root[data-theme="dark"] .note{background:#3a2f12;border-color:#6b5517;color:#f2d68a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.tile{border-radius:11px;padding:8px 12px;background:var(--soft)}.tile b{font-size:21px;display:block}.tile span{font-size:12px;color:var(--mut)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@container (max-width:760px){.charts{grid-template-columns:1fr}}
.chart{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.chart h5{margin:0 0 6px;font-size:13px;color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td.ts{white-space:nowrap;font-variant-numeric:tabular-nums}
td.rm{min-width:150px;overflow-wrap:anywhere}
.st{border-radius:12px;font-weight:700;font-size:12px;padding:3px 6px;border:none;width:auto;cursor:pointer}
.st-Pending{background:#fff1cf;color:#8a5a00}.st-Done{background:#d9f2e3;color:#14663a}.st-Cancelled{background:#e3e7ec;color:#4a5662}
.st-Wait{background:#dcebfb;color:#0b4f8a}.st-Close{background:#ecdff7;color:#6a3a98}
.empty{text-align:center;color:var(--mut);padding:26px}
.fbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;margin:8px 0}
@container (max-width:760px){.fbar{grid-template-columns:1fr 1fr}.fbar>:first-child{grid-column:1/-1}}
.fbar small{display:block;font-size:11px;color:var(--mut)}
footer.ver{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px}
footer.ver .btn{box-shadow:var(--shadow)}
.hist li{margin-bottom:5px}.vb{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:0 8px;font-weight:700;margin-right:6px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#14202e;color:#fff;padding:9px 18px;border-radius:22px;z-index:200;font-size:14px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="brand" id="brand"><span class="logo">🧳</span><div><b>BFS Baggage Service Information Center <span class="vtag" id="vtag"></span></b><small>Ground handling · Airline baggage operations · Bangkok-Suvarnabhumi (BKK)</small></div></div>
  <div class="gsearch"><label>ADVANCE SEARCH BAR</label><span class="ico">🔍</span><input id="gq" type="search" autocomplete="off" placeholder="Search any topic across all sections (e.g. 'contact history', 'DPR', 'QR', case number)…"><div class="gres" id="gres"></div></div>
  <button class="sync" id="syncBtn" title="Cloud sync status">🔄 Connecting…</button><button class="btn sm" id="themeBtn" title="Toggle light / dark">🌓</button>
</div></header>
<nav class="bar" id="nav"></nav>
<main id="main"></main>
<footer class="ver"><button class="btn sm" id="dataBtn">⚙ Data</button><button class="btn sm" id="verBtn">v<span id="verNum"></span> · Update history</button></footer>

<script>
/* ============ CONFIG ============ */
const VERSION="1.0.3";
const CHANGELOG=[
 {v:"1.0.3",d:"2026-10-09",items:["Sorting Bag Record rebuilt as a native page of this platform (no longer embedded) — same fields, comments history, statuses, PDF slips, summary PDF and CSV import/export.","Sorting Bag Record now syncs through this platform's Firebase database (collections 'sorting' and 'sorting_photos') with the same real-time sync and offline queue as the other sections.","Photos: a small thumbnail is stored with each record and the full photo is loaded on demand, keeping the dashboard fast.","Comments & status changes are merged safely when several people update the same bag at once.","'Import from old cloud' button brings in records from the previous standalone Sorting app."]},
 {v:"1.0.2",d:"2026-10-09",items:["New section: Sorting Bag Record (BKK TBT baggage tracker) merged into the platform — record bags with photo, follow-up comments, status Pending/Forwarded, PDF slips, CSV import/export. It keeps its own Firebase database so existing records are preserved.","Pagination: every dashboard (Phone Pick-up, Office 1st floor, Sorting Bag Record, Email Templates) now shows 30 items per page with Prev / page numbers / Next.","Advance Search Bar also finds Sorting Bag Record entries (tag, flight, AHL case, comments) and shows where they came from.","Sorting Bag Record can be used in split view and follows the light/dark theme."]},
 {v:"1.0.1",d:"2026-10-09",items:["Fixed: pressing Edit / Delete in Contact History opened many windows (duplicate click handlers).","Split view: drag any section button from the top bar onto the page and drop it on the left or right pane.","Firebase (Firestore) cloud sync: templates and contact records are shared in real time across devices.","Offline support: changes are saved on the device and sent automatically once the connection is back; cloud status indicator added in the header."]},
 {v:"1.0.0",d:"2026-10-08",items:["Initial release: Home page with 3 section buttons (section list is configurable for future sections).","Email Template platform: 50 templates imported from CSV, filter by Airline / Type, search, EN/TH toggle, add / edit / delete, copy subject & body.","44 templates without Thai were translated from English into formal airline-industry Thai (flagged 'Auto-translated' for review).","Airlines Policy section placeholder (content to be added later).","Contact History: Phone Pick-up and Office 1st floor logs with timestamps, dashboards, advanced filters and statistic charts.","Advance Search Bar on every page searching all sections and showing where each result came from.","Split view: show any two sections side by side.","Version number and update history; data backup / restore (JSON)."]}
];
const SECTIONS=[
 {id:"email",icon:"✉️",name:"Email Template Platform",short:"Email Templates",desc:"Ready-to-use emailing templates for every baggage situation, in English & Thai.",kw:"email template mail thai english language airlines type report"},
 {id:"policy",icon:"📘",name:"Airlines Policy",short:"Airlines Policy",desc:"Airline baggage service operation policies (content will be updated later).",kw:"airline policy baggage rules operation",soon:true},
 {id:"contact",icon:"📞",name:"Contact History",short:"Contact History",desc:"Record passenger contacts: Phone Pick-up and Office 1st floor, with dashboards & statistics.",kw:"contact history phone pick-up office 1st floor passenger record dashboard statistic"},
 {id:"sorting",icon:"🧳",name:"Sorting Bag Record",short:"Sorting Bag Record",desc:"TBT sorting area baggage tracker: record bags with photo, comments, forward status and PDF slips.",kw:"sorting bag record tbt tracker baggage tag ahl flight forwarded pending photo pdf slip"}
];
const PHONE_TOPICS=["Case file follow up","Request Baggage Offload","Complain","Other (Bag Switch, Etc)"];
const PHONE_ST=["Pending","Done","Cancelled"];
const OFFICE_TOPICS=["Case file follow up","Request Baggage Offload","Report Creation","Baggage Collection","Other (Bag Switch, Etc)"];
const OFFICE_ST=["Pending","Wait for Porter","Wait for close files","Done","Cancelled"];

ารบิน xxxxxx (ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ)\nเรามีความยินดีที่จะแจ้งให้ทราบว่า สัมภาระของท่านที่เกี่ยวข้องกับหมายเลขอ้างอิงไฟล์ xxxxxx ได้มาถึงที่ท่าอากาศยานสุวรรณภูมิแล้ว กรุณาแจ้งสนามบินที่สะดวกที่สุดสำหรับการรับสัมภาระของท่าน\n\nหากท่านต้องการรับสัมภาระที่สนามบินสุวรรณภูมิ (BKK)\nท่านสามารถติดต่อรับสัมภาระได้ที่ สำนักงานบริการสัมภาระ ซึ่งตั้งอยู่ที่ ประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน) เมื่อท่านมาถึง กรุณาติดต่อเราทางโทรศัพท์ที่หมายเลข +66 2134 4357-8 หรือ ตอบกลับทางอีเมลนี้\nโปรดรอเจ้าหน้าที่ของเรา ซึ่งจะอำนวยความสะดวกในการนำสัมภาระออกจากพื้นที่จัดเก็บซึ่งอยู่ในเขตควบคุม\nกรุณาอย่าลืมนำเอกสารดังต่อไปนี้มาแสดง:\n\nหนังสือเดินทาง\nใบรายงาน\nบอร์ดดิ้งพาส\nหนังสือมอบอำนาจ (กรณีส่งบุคคลอื่นมารับแทน)\n\nเราขออภัยในความไม่สะดวกที่เกิดขึ้น\nหากท่านมีข้อสงสัยหรือต้องการความช่วยเหลือเพิ่มเติม กรุณาติดต่อเราได้ทุกเมื่อ\nเราหวังว่าจะได้รับการติดต่อจากท่านในเร็ว ๆ นี้", "thAuto": false, "titleThAuto": false, "hist": []}, {"id": "t3", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "REQUEST PASSENGER COLLECT AT AIRPORT", "titleTh": "ขอให้ผู้โดยสารมารับกระเป๋าที่สนามบิน", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\nGreetings from xxxxxxx Airlines Baggage Handling Services at Suvarnabhumi Airport.\n\nWe are pleased to inform you that your baggage, associated with file reference number xxxxxx, has arrived at Bangkok Suvarnabhumi Airport.\n\nYou may collect your baggage from our Baggage Service Office, located at Gate 7, 1st Floor (between the women’s restroom and the escalator). Kindly ensure you bring the following documents for identification:\n\nYour passport\nThe baggage report (PIR)\nYour boarding pass\n\nIf you are unable to collect the baggage in person and wish to authorize a representative to do so on your behalf, the following documents are required:\n\nA letter of authorization\nA copy of your passport or ID card\nA copy of the PIR report\nA copy of the representative’s passport or ID card\n\nUpon arrival,  these safety requirements, you are required to collect your baggage in person at Suvarnabhumi Bangkok Airport.\nYou may collect your baggage from our Baggage Service Office, located at Gate 7, 1st Floor (between the women’s restroom and the escalator).\n\nKindly ensure you bring the following documents for identification:\n\nYour passport\nThe baggage report (PIR)\nYour boarding pass\n\nIf you are unable to collect the baggage in person and wish to authorize a representative to do so on your behalf, the following documents are required:\n\nA letter of authorization\nA copy of your passport or ID card\nA copy of the PIR report\nA copy of the representative’s passport or ID card\n\nFor any questions or assistance, please contact us at +66 (0) 2134 4357 or BFSLLSpvrs@BFSAsia.com.\nThank you for your understanding and cooperation.", "th": "เรียน ผู้โดยสาร,\nขอแจ้งให้ทราบว่าสัมภาระที่ท่านโหลดใต้ท้องเครื่องมีสิ่งของต้องห้ามตามข้อกำหนดของสายการบินและกฎระเบียบด้านความปลอดภัยทางการบิน ซึ่งไม่สามารถนำขึ้นเครื่องได้\nเพื่อปฏิบัติตามข้อกำหนดด้านความปลอดภัย ท่านจำเป็นต้องมารับสัมภาระด้วยตนเองที่ ท่าอากาศยานสุวรรณภูมิ\nท่านสามารถรับสัมภาระได้ที่ สำนักงานบริการสัมภาระ (Baggage Service Office) ซึ่งตั้งอยู่ที่ ประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน) กรุณานำเอกสารดังต่อไปนี้มาเพื่อยืนยันตัวตน:\n\nหนังสือเดินทางของท่าน\nรายงานสัมภาระ (PIR)\nบัตรโดยสารของท่าน\n\nหากท่านไม่สามารถมารับสัมภาระด้วยตนเอง และต้องการมอบอำนาจให้ผู้อื่นมารับแทน กรุณาจัดเตรียมเอกสารดังต่อไปนี้:\n\nหนังสือมอบอำนาจ\nสำเนาหนังสือเดินทางหรือบัตรประชาชนของท่าน\nสำเนารายงานสัมภาระ (PIR)\nสำเนาหนังสือเดินทางหรือบัตรประชาชนของผู้รับแทน\n\nหากมีข้อสงสัยหรือต้องการความช่วยเหลือ กรุณาติดต่อเราที่ +66 (0) 2134 4357 / +66 (2) 134 4358 หรือ BFSLLSpvrs@BFSAsia.com\nขอขอบคุณในความเข้าใจและความร่วมมือของท่าน", "thAuto": false, "titleThAuto": false, "hist": []}, {"id": "t5", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "APOLOGIZE MESSAGE", "titleTh": "อีเมลขอโทษ กระเป๋ากำลังติดตาม", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nGreeting from baggage service handling of xxxxxx (Bangkok-Suvarnabhumi Airport),\nRegarding delayed baggage reference : xxxxxxx.\n\nWe would like to state again that we are sorry for the baggage irregularity you have experienced. Please be informed the status of baggage is currently being traced.\nIf we got any information from xxxxxxx, we'll update to you soon.\n\nThank you for your understanding with the process.\n\nWe apologize for the inconvenience.\nPlease do not hesitate to contact us if you have any further requirements.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ xxxxxx (ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ) เรื่องสัมภาระล่าช้าเลขอ้างอิง\n\nทางเราขอแสดงความเสียใจอีกครั้งต่อเหตุการณ์ความผิดปกติของสัมภาระที่ท่านได้ประสบ ทางเราขอแจ้งให้ทราบว่าสถานะของสัมภาระกำลังอยู่ระหว่างการติดตาม หากมีข้อมูลเพิ่มเติมจาก xxxxxxx ทางเราจะรีบแจ้งให้ท่านทราบโดยเร็ว\n\nขอขอบคุณสำหรับความเข้าใจในกระบวนการดังกล่าว\n\nทางเราขออภัยในความไม่สะดวกที่เกิดขึ้น", "thAuto": false, "titleThAuto": false, "hist": []}, {"id": "t6", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "REQUEST PHOTO OF BAGGAGE FOR FURTHER TRACING (ONLY PHOTO)", "titleTh": "ขอภาพกระเป๋าผู้โดยสาร", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\nRegarding delayed baggage file reference ..............\n\n      We would like to state that we are sorry for the loss of your baggage. You can be assured that we will continue to work diligently to find and deliver your baggage to you. We aim to provide you with positive information as soon as possible. In order for your baggage to be found faster, we kindly ask you to send us a previously taken photo of your lost baggage, if available.\n\nThank you for your understanding.", "th": "เรียนผู้โดยสาร\n\nอ้างถึงหมายเลขอ้างอิงสัมภาระล่าช้า ..............\n\nทางเราขออภัยเป็นอย่างสูงที่สัมภาระของท่านสูญหายระหว่างการเดินทาง ท่านสามารถมั่นใจได้ว่าเราจะยังคงดำเนินการติดตามและนำส่งสัมภาระคืนแก่ท่านอย่างเต็มความสามารถ และจะแจ้งข่าวที่เป็นประโยชน์ให้ท่านทราบโดยเร็วที่สุด เพื่อให้การค้นหาสัมภาระเป็นไปได้รวดเร็วยิ่งขึ้น ขอความกรุณาท่านส่งภาพถ่ายสัมภาระที่เคยถ่ายไว้ก่อนหน้า (หากมี) มายังเรา\n\nขอขอบพระคุณในความเข้าใจของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t7", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "REQUEST PHOTO AND FILL UP BCQ OF BAGGAGE FOR FURTHER TRACING (BCQ,PHOTO)", "titleTh": "ขอภาพกระเป๋าผู้โดยสาร + กรอก BCQ (BCQ,PHOTO)", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nRegarding delayed baggage file reference ..............\n\n      We would like to state that we are sorry for the loss of your baggage. You can be assured that we will continue to work diligently to find and deliver your baggage to you. We aim to provide you with positive information as soon as possible. In order for your baggage to be found faster, we kindly ask you to send us a previously taken photo of your lost baggage, if available. And for efficiently of tracing process please fill up attach form of Baggage Inventory Questionnaire and we will forward to airline.\n\nThank you for your understanding.", "th": "เรียน ผู้โดยสาร,\nเกี่ยวกับไฟล์อ้างอิงสัมภาระล่าช้า หมายเลข ..............\nเราขอแสดงความเสียใจเป็นอย่างยิ่งต่อการสูญหายของสัมภาระของท่าน และขอให้ท่านมั่นใจว่าเราจะดำเนินการอย่างเต็มที่เพื่อค้นหาและส่งมอบสัมภาระของท่านให้โดยเร็วที่สุด เรามุ่งหวังที่จะให้ข้อมูลที่เป็นบวกแก่ท่านโดยเร็วที่สุด\n\nเพื่อให้การติดตามสัมภาระเป็นไปอย่างรวดเร็วขึ้น เราขอความกรุณาท่านส่งรูปถ่ายสัมภาระที่เคยถ่ายไว้ (ถ้ามี) และเพื่อความมีประสิทธิภาพในกระบวนการติดตาม กรุณากรอกแบบฟอร์ม Baggage Inventory Questionnaire ที่แนบมาพร้อมอีเมลนี้ เพื่อที่เราจะได้ส่งต่อให้สายการบินดำเนินการต่อไป\n\nขอขอบคุณสำหรับความเข้าใจของท่าน", "thAuto": false, "titleThAuto": false, "hist": []}, {"id": "t8", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "IDENTIFY BAG WITH PASSENGER (TAGLESS)", "titleTh": "IDENTIFY กระเป๋าแทคขาด", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nRegarding delayed baggage file reference xxxxxxx\n\n We would like to state that we are sorry for the loss of your baggage. We are continuing our efforts to locate your baggage. We have detected baggage with the characteristics you have specified. We kindly ask you to check the attached photo and let us know if the baggage belongs to you.\n\nWe look forward to hearing from you.", "th": "เรียนผู้โดยสาร\n\nอ้างถึงหมายเลขอ้างอิงสัมภาระล่าช้า xxxxxxx\n\nทางเราขออภัยเป็นอย่างสูงที่สัมภาระของท่านสูญหายระหว่างการเดินทาง ทางเราอยู่ระหว่างดำเนินการค้นหาสัมภาระของท่านอย่างต่อเนื่อง และตรวจพบสัมภาระที่มีลักษณะตรงตามที่ท่านระบุ ขอความกรุณาท่านตรวจสอบภาพถ่ายที่แนบมา และแจ้งให้เราทราบว่าสัมภาระดังกล่าวเป็นของท่านหรือไม่\n\nเราหวังเป็นอย่างยิ่งว่าจะได้รับการติดต่อกลับจากท่านในเร็ววัน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t9", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "IDENTIFY BAG WITH PASSENGER + CONFIRMED ADDRESS (TAGLESS)", "titleTh": "IDENTIFY กระเป๋าแทคขาด + ขอที่อยู่จัดส่ง", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nRegarding delayed baggage file reference xxxxxxx\n\n We would like to state that we are sorry for the loss of your baggage. We are continuing our efforts to locate your baggage. We have detected baggage with the characteristics you have specified. We kindly ask you to check the attached photo and let us know if the baggage belongs to you.\n\nIn case of need, delivery baggage if baggage was belong to you.\n • The address, hotel name, room number where you want it to be delivered\n • Your contact information.\n\nIn case of need, to collect baggage at BKK airport.\n      You may collect your baggage from our Baggage Service Office, located at Gate 7, 1st Floor (between the women’s restroom and the escalator), when you arrive, please contact us by phone call at + 6621344357-8 or reply back to our e-mail.\nPlease stand by our staff will then assist you as soon as possible in collecting your belongings from the storage area, which is in the restricted area.\n\nPlease don't forget\n\n1.Passport\n2.Report paper\n3.Boarding pass\n4.Authorize Letter (If send Third Party)\n\nWe apologize for the inconvenience.\nPlease do not hesitate to contact us if you have any further requirements.\n\nWe look forward to hearing from you soon.", "th": "เรียนผู้โดยสาร\n\nอ้างถึงหมายเลขอ้างอิงสัมภาระล่าช้า xxxxxxx\n\nทางเราขออภัยเป็นอย่างสูงที่สัมภาระของท่านสูญหายระหว่างการเดินทาง ทางเราอยู่ระหว่างดำเนินการค้นหาสัมภาระของท่านอย่างต่อเนื่อง และตรวจพบสัมภาระที่มีลักษณะตรงตามที่ท่านระบุ ขอความกรุณาท่านตรวจสอบภาพถ่ายที่แนบมา และแจ้งให้เราทราบว่าสัมภาระดังกล่าวเป็นของท่านหรือไม่\n\nกรณีประสงค์ให้จัดส่งสัมภาระ (หากสัมภาระดังกล่าวเป็นของท่าน)\n • ที่อยู่โดยละเอียด ชื่อโรงแรม และหมายเลขห้องที่ต้องการให้จัดส่ง\n • ข้อมูลติดต่อของท่าน เช่น หมายเลขโทรศัพท์หรืออีเมล\n\nกรณีประสงค์รับสัมภาระด้วยตนเอง ณ ท่าอากาศยานสุวรรณภูมิ\nท่านสามารถติดต่อรับสัมภาระได้ที่สำนักงานบริการสัมภาระ บริเวณประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน) เมื่อเดินทางมาถึง กรุณาติดต่อเจ้าหน้าที่ทางหมายเลขโทรศัพท์ +6621344357-8 หรือแจ้งกลับทางอีเมล\nเจ้าหน้าที่จะอำนวยความสะดวกในการนำสัมภาระออกจากพื้นที่จัดเก็บ ซึ่งอยู่ในเขตควบคุม\n\nเอกสารที่ต้องนำมาแสดงในวันรับสัมภาระ :\n\n1. หนังสือเดินทาง\n2. ใบรายงานสัมภาระ\n3. บัตรโดยสาร\n4. หนังสือมอบอำนาจ (กรณีมอบหมายบุคคลอื่นมารับแทน)\n\nทางสายการบินขออภัยเป็นอย่างสูงในความไม่สะดวกที่เกิดขึ้น\nหากท่านมีข้อสงสัยหรือความต้องการเพิ่มเติม กรุณาอย่าลังเลที่จะติดต่อเรา\n\nเราหวังเป็นอย่างยิ่งว่าจะได้รับการติดต่อกลับจากท่านในเร็ววัน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t10", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Airline / Station", "titleEn": "CONFIRMATION BAGGAGE DELIVERED WITH PASSENGER", "titleTh": "ขอ Confirm ผู้โดยสารกระเป๋าว่าได้รับกระเป๋าหรือยัง", "subject": "Delayed Baggage reference -", "en": "Dear …….,\n\nRegarding delayed baggage file reference ……\n\nFirst of all, we would like to state that we are sorry for the problem you experienced. When we checked your report number ……......,it appears that your baggage has been delivered. We kindly ask you to inform us whether your baggage has been delivered or not.\n\nWish to meet with you again on new flights.", "th": "เรียน …….,\n\nอ้างถึงหมายเลขอ้างอิงสัมภาระล่าช้า ……\n\nขอเรียนว่าทางเราขออภัยเป็นอย่างสูงสำหรับปัญหาที่ท่านประสบ จากการตรวจสอบหมายเลขรายงาน ……...... ปรากฏว่าสัมภาระของท่านได้รับการจัดส่งเรียบร้อยแล้ว ขอความกรุณาท่านแจ้งให้เราทราบว่าท่านได้รับสัมภาระแล้วหรือไม่\n\nเราหวังเป็นอย่างยิ่งว่าจะมีโอกาสให้บริการท่านอีกครั้งในเที่ยวบินต่อไป", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t11", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "UPDATED FORWARDING INFO WITH PASSENGER", "titleTh": "อัพเดท Forward ให้ผู้โดยสาร", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nWarm greetings from the baggage handling service of XXXXXX at Bangkok–Suvarnabhumi Airport.\n\nWe would like to inform you that your baggage has been identified for forwarding and is planned to be transported on the next available flight. It is expected to arrive in Bangkok on flight XXXXXX. Please note that we are in the process of reconfirming the flight schedule and will provide you with an official update once the details are fully verified.\n\nWe appreciate your patience and will keep you promptly informed.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ XXXXXX ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nขอแจ้งให้ท่านทราบว่าสัมภาระของท่านได้รับการระบุตัวและกำหนดส่งต่อ (Forward) ด้วยเที่ยวบินที่เร็วที่สุดเท่าที่จะเป็นไปได้ โดยคาดว่าจะเดินทางถึงกรุงเทพฯ ด้วยเที่ยวบิน XXXXXX ทั้งนี้ ขณะนี้เราอยู่ระหว่างการยืนยันตารางเที่ยวบินอีกครั้ง และจะแจ้งข้อมูลอย่างเป็นทางการให้ท่านทราบอีกครั้งเมื่อตรวจสอบรายละเอียดครบถ้วนแล้ว\n\nขอขอบคุณในความอดทนรอของท่าน และเราจะแจ้งความคืบหน้าให้ท่านทราบโดยเร็วที่สุด", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t12", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "UPDATED FORWARDING INFO WITH PASSENGER + CONFIRM ADDRESS", "titleTh": "อัพเดท Forward ให้ผู้โดยสาร + ขอที่อยู่จัดส่ง", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nWarm greetings from the baggage handling service of XXXXXX at Bangkok–Suvarnabhumi Airport.\n\nWe would like to inform you that your baggage has been identified for forwarding and is planned to be transported on the next available flight. It is expected to arrive in Bangkok on flight XXXXXX. Please note that we are in the process of reconfirming the flight schedule and will provide you with an official update once the details are fully verified.\n\nIn case of need, delivery baggage if baggage has been received.\n • The address, hotel name, room number where you want it to be delivered\n • Your contact information.\n\nIn case of need, to collect baggage at BKK airport.\n      You may collect your baggage from our Baggage Service Office, located at Gate 7, 1st Floor (between the women’s restroom and the escalator), when you arrive, please contact us by phone call at + 6621344357-8 or reply back to our e-mail.\nPlease stand by our staff will then assist you as soon as possible in collecting your belongings from the storage area, which is in the restricted area.\n\nPlease don't forget\n\n1.Passport\n2.Report paper\n3.Boarding pass\n4.Authorize Letter (If send Third Party)\n\nWe apologize for the inconvenience.\nPlease do not hesitate to contact us if you have any further requirements.\n\nWe look forward to hearing from you soon.\n\nWe appreciate your patience and will keep you promptly informed.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ XXXXXX ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nขอแจ้งให้ท่านทราบว่าสัมภาระของท่านได้รับการระบุตัวและกำหนดส่งต่อ (Forward) ด้วยเที่ยวบินที่เร็วที่สุดเท่าที่จะเป็นไปได้ โดยคาดว่าจะเดินทางถึงกรุงเทพฯ ด้วยเที่ยวบิน XXXXXX ทั้งนี้ ขณะนี้เราอยู่ระหว่างการยืนยันตารางเที่ยวบินอีกครั้ง และจะแจ้งข้อมูลอย่างเป็นทางการให้ท่านทราบอีกครั้งเมื่อตรวจสอบรายละเอียดครบถ้วนแล้ว\n\nกรณีประสงค์ให้จัดส่งสัมภาระ (เมื่อสัมภาระมาถึงแล้ว)\n • ที่อยู่โดยละเอียด ชื่อโรงแรม และหมายเลขห้องที่ต้องการให้จัดส่ง\n • ข้อมูลติดต่อของท่าน เช่น หมายเลขโทรศัพท์หรืออีเมล\n\nกรณีประสงค์รับสัมภาระด้วยตนเอง ณ ท่าอากาศยานสุวรรณภูมิ\nท่านสามารถติดต่อรับสัมภาระได้ที่สำนักงานบริการสัมภาระ บริเวณประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน) เมื่อเดินทางมาถึง กรุณาติดต่อเจ้าหน้าที่ทางหมายเลขโทรศัพท์ +6621344357-8 หรือแจ้งกลับทางอีเมล\nเจ้าหน้าที่จะอำนวยความสะดวกในการนำสัมภาระออกจากพื้นที่จัดเก็บ ซึ่งอยู่ในเขตควบคุม\n\nเอกสารที่ต้องนำมาแสดงในวันรับสัมภาระ :\n\n1. หนังสือเดินทาง\n2. ใบรายงานสัมภาระ\n3. บัตรโดยสาร\n4. หนังสือมอบอำนาจ (กรณีมอบหมายบุคคลอื่นมารับแทน)\n\nทางสายการบินขออภัยเป็นอย่างสูงในความไม่สะดวกที่เกิดขึ้น\nหากท่านมีข้อสงสัยหรือความต้องการเพิ่มเติม กรุณาอย่าลังเลที่จะติดต่อเรา\n\nเราหวังเป็นอย่างยิ่งว่าจะได้รับการติดต่อกลับจากท่านในเร็ววัน\n\nขอขอบคุณในความอดทนรอของท่าน และเราจะแจ้งความคืบหน้าให้ท่านทราบโดยเร็วที่สุด", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t13", "airline": "ALL AIRLINES", "type": "SWITCH BAG (CBT)", "aud": "Passenger", "titleEn": "Notify To Return baggage", "titleTh": "แจ้งให้นำกระเป๋ามาคืน", "subject": "Switch Baggage reference -", "en": "Dear Passenger,\n\nGreetings from the Lost and Found Department at Bangkok-Suvarnabhumi Airport.\n\nWe are writing to inform you that your baggage is still stored at the airport. It is possible that you may have mistakenly taken the wrong baggage. We kindly request that you recheck your baggage to confirm this.\n\nIf you have indeed taken the wrong baggage, please return it urgently. located at Gate 7, 1st Floor (between the women’s restroom and the escalator).\n\nWe apologize for any inconvenience this may have caused and appreciate your prompt attention to this matter.\n\nThank you for your cooperation.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายสัมภาระตกหล่นและของหาย (Lost and Found) ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nขอแจ้งให้ท่านทราบว่าสัมภาระของท่านยังคงถูกจัดเก็บอยู่ที่ท่าอากาศยาน ทั้งนี้ อาจเป็นไปได้ว่าท่านได้หยิบสัมภาระผิดใบโดยไม่ได้ตั้งใจ ขอความกรุณาท่านตรวจสอบสัมภาระของท่านอีกครั้งเพื่อยืนยัน\n\nหากพบว่าท่านหยิบสัมภาระผิดใบจริง ขอความกรุณานำสัมภาระมาคืนโดยด่วนที่สำนักงานบริการสัมภาระ บริเวณประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน)\n\nทางเราขออภัยในความไม่สะดวกที่อาจเกิดขึ้น และขอขอบคุณในความรวดเร็วในการดำเนินการเรื่องนี้\n\nขอขอบพระคุณในความร่วมมือของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t14", "airline": "ALL AIRLINES", "type": "OHD", "aud": "Passenger", "titleEn": "NOTIFY PASSENGER FOR COLLECT UNCLAIMED BAG", "titleTh": "แจ้งให้มารับกระเป๋า (Unclaimed)", "subject": "Unclaimed Baggage reference -", "en": "Dear Passenger,\n\nGreeting from handling baggage service of [ airlines ] (Bangkok-Suvarnabhumi Airport), We would like to inform you that your baggage (….baggage tag number …) has been recorded with the number OHD … ...........\n\nYou may collect your baggage from our Baggage Service Office, located at Gate 7, 1st Floor (between the women’s restroom and the escalator).\n\nKindly ensure you bring the following documents for identification;\n\n1. Your passport\n2. Your boarding pass\n\nWe look forward to hearing from you.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ [ สายการบิน ] ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ ขอแจ้งให้ท่านทราบว่าสัมภาระของท่าน (หมายเลขป้ายสัมภาระ …. ) ได้รับการบันทึกในระบบด้วยหมายเลข OHD … ...........\n\nท่านสามารถติดต่อรับสัมภาระได้ที่สำนักงานบริการสัมภาระ บริเวณประตู 7 ชั้น 1 (ระหว่างห้องน้ำหญิงและบันไดเลื่อน)\n\nขอความกรุณานำเอกสารต่อไปนี้มาแสดงเพื่อยืนยันตัวตน\n\n1. หนังสือเดินทาง\n2. บัตรโดยสาร\n\nเราหวังเป็นอย่างยิ่งว่าจะได้รับการติดต่อกลับจากท่านในเร็ววัน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t15", "airline": "ALL AIRLINES", "type": "CUSTOMS/SECURITY", "aud": "Passenger", "titleEn": "CUSTOMS INSPECTION", "titleTh": "แจ้งให้เซ็นต์ Authorize เพื่อ Declare Customs", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nGreetings from baggage service handling for xxxxxxx (Bangkok-Suvarnabhumi Airport),\n\nWe are writing to inform you that your delayed baggage has arrived at Bangkok-Suvarnabhumi Airport. Please be advised that some items in your baggage have been flagged by Customs for inspection. To proceed with the necessary declaration process, kindly sign authorize letter for open baggage to check item inside.\n\nAlternatively, you may contact the Customs Department at Suvarnabhumi Airport directly for further assistance and guidance.\n\nThank you for your attention to this matter.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ xxxxxxx ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nขอแจ้งให้ท่านทราบว่าสัมภาระล่าช้าของท่านเดินทางมาถึงท่าอากาศยานสุวรรณภูมิแล้ว อย่างไรก็ตาม ทางศุลกากรได้ระบุว่าสิ่งของบางรายการในสัมภาระของท่านต้องได้รับการตรวจสอบ เพื่อดำเนินการตามขั้นตอนการสำแดงรายการ ขอความกรุณาท่านลงนามในหนังสือมอบอำนาจเพื่ออนุญาตให้เปิดสัมภาระและตรวจสอบสิ่งของภายใน\n\nหรือท่านอาจติดต่อกรมศุลกากร ณ ท่าอากาศยานสุวรรณภูมิโดยตรงเพื่อขอรับความช่วยเหลือและคำแนะนำเพิ่มเติม\n\nขอขอบพระคุณในความร่วมมือของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t16", "airline": "ALL AIRLINES", "type": "CUSTOMS/SECURITY", "aud": "Passenger", "titleEn": "SECURITY AUTHORIZATION", "titleTh": "แจ้งให้เซ็นต์ Authorize เพื่อเปิดกระเป๋า", "subject": "", "en": "Dear Passenger,\n\nGreetings from baggage service handling for xxxxxx (BKK) (Bangkok-Suvarnabhumi Airport),\n\nWe are writing to inform you that your delayed baggage has arrived at Bangkok-Suvarnabhumi Airport. Please be advised that some items in your baggage have been flagged by Security Inspection. To proceed with the necessary declaration process, kindly sign authorize letter for open baggage to check item inside.\n\nAlternatively, you may contact the Airline on related station directly for further assistance and guidance.\n\nThank you for your attention to this matter.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ xxxxxx (BKK) ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nขอแจ้งให้ท่านทราบว่าสัมภาระล่าช้าของท่านเดินทางมาถึงท่าอากาศยานสุวรรณภูมิแล้ว อย่างไรก็ตาม ฝ่ายตรวจสอบความปลอดภัยได้ระบุว่าสิ่งของบางรายการในสัมภาระของท่านต้องได้รับการตรวจสอบ เพื่อดำเนินการตามขั้นตอนที่จำเป็น ขอความกรุณาท่านลงนามในหนังสือมอบอำนาจเพื่ออนุญาตให้เปิดสัมภาระและตรวจสอบสิ่งของภายใน\n\nหรือท่านอาจติดต่อสายการบินที่สถานีที่เกี่ยวข้องโดยตรงเพื่อขอรับความช่วยเหลือและคำแนะนำเพิ่มเติม\n\nขอขอบพระคุณในความร่วมมือของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t17", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "OFFER ADVANCE SETTLEMENT AHL", "titleTh": "เสนอเงินชดเชยกระเป๋าล่าช้า", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nGreeting from handling baggage service of [ airlines ] (Bangkok-Suvarnabhumi Airport),\n\nRegarding delayed baggage file reference XXXXXXXX\n\nWe would like to state again that we are sorry for the baggage irregularity you have experienced.\nThe Airlines would like to offer in amount XXXX compensation for your delayed baggage case.\nIf you accept this offer, please reply to this email for related documents.\n\nYours sincerely,", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ [ สายการบิน ] ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nอ้างถึงหมายเลขอ้างอิงสัมภาระล่าช้า XXXXXXXX\n\nทางเราขออภัยอีกครั้งสำหรับความผิดปกติเกี่ยวกับสัมภาระที่ท่านประสบ\nทางสายการบินขอเสนอเงินชดเชยจำนวน XXXX สำหรับกรณีสัมภาระล่าช้าของท่าน\nหากท่านยอมรับข้อเสนอนี้ กรุณาตอบกลับอีเมลฉบับนี้เพื่อรับเอกสารที่เกี่ยวข้อง\n\nขอแสดงความนับถือ", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t18", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Passenger", "titleEn": "OFFER FINAL SETTLEMENT DPR", "titleTh": "เสนอเงินชดเชยกระเป๋าเสียหาย", "subject": "Damaged Baggage reference -", "en": "Dear Passenger,\n\nThank you for reaching out to us regarding your claim. After thoroughly reviewed your claim and consulted with our claim team, I am pleased to inform you that we are offering you a settlement claim of THB xxxx.\n\nTo proceed with the settlement, we kindly request that you reply to this email with your acceptance of the offer. Once we receive your confirmation, we will initiate the necessary process to ensure the prompt delivery of the settlement amount.\n\nWe sincerely apologize for the inconvenience occurred during your recent experience with (Airlines). We value your patronage and hope that you will give us another opportunity to serve you in the future.", "th": "เรียนผู้โดยสาร\n\nขอบคุณที่ติดต่อเราเกี่ยวกับการเรียกร้องค่าชดเชยของท่าน หลังจากพิจารณาข้อเรียกร้องของท่านอย่างละเอียดและปรึกษากับทีมงานที่รับผิดชอบแล้ว ทางเรายินดีแจ้งว่าขอเสนอค่าชดเชยเป็นจำนวน xxxx บาท\n\nเพื่อดำเนินการจ่ายค่าชดเชย ขอความกรุณาท่านตอบกลับอีเมลฉบับนี้เพื่อแสดงการยอมรับข้อเสนอ เมื่อเราได้รับการยืนยันจากท่านแล้ว เราจะเริ่มดำเนินการที่จำเป็นเพื่อจ่ายค่าชดเชยให้ท่านโดยเร็วที่สุด\n\nทางเราขออภัยอย่างสูงสำหรับความไม่สะดวกที่เกิดขึ้นระหว่างการใช้บริการของท่านกับ (สายการบิน) เราให้ความสำคัญกับการใช้บริการของท่าน และหวังเป็นอย่างยิ่งว่าจะได้รับโอกาสให้บริการท่านอีกครั้งในอนาคต", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t19", "airline": "EK", "type": "DPR", "aud": "Passenger", "titleEn": "OFFER FINAL SETTLEMENT DPR", "titleTh": "เสนอเงินชดเชยกระเป๋าเสียหาย (EK)", "subject": "Damaged Baggage reference -", "en": "Dear Valued Passenger,\n\nGreeting from Emirates Baggage Services Bangkok.\n\nThank you for reaching out to us regarding your claim under reference : XXXXXXXXX. After thoroughly reviewed your claim and consulted with our claim team, I am pleased to inform you that we are offering you a settlement claim of\nXXXXXTHB\nTo proceed with the settlement, we kindly request that you reply to this email with your acceptance of the offer. Once we receive your confirmation, we will initiate the necessary process to ensure the prompt delivery of the settlement amount.\n\nWe sincerely apologize for the inconvenience occurred during your recent experience with Emirates. We value your patronage and hope that you will give us another opportunity to serve you in the future.", "th": "เรียนท่านผู้โดยสารที่เคารพ\n\nขอแสดงความนับถือจากฝ่ายบริการสัมภาระของสายการบินเอมิเรตส์ ประจำกรุงเทพฯ\n\nขอบคุณที่ติดต่อเราเกี่ยวกับการเรียกร้องค่าชดเชยของท่าน หมายเลขอ้างอิง : XXXXXXXXX หลังจากพิจารณาข้อเรียกร้องของท่านอย่างละเอียดและปรึกษากับทีมงานที่รับผิดชอบแล้ว ทางเรายินดีแจ้งว่าขอเสนอค่าชดเชยเป็นจำนวน\nXXXXX บาท\n\nเพื่อดำเนินการจ่ายค่าชดเชย ขอความกรุณาท่านตอบกลับอีเมลฉบับนี้เพื่อแสดงการยอมรับข้อเสนอ เมื่อเราได้รับการยืนยันจากท่านแล้ว เราจะเริ่มดำเนินการที่จำเป็นเพื่อจ่ายค่าชดเชยให้ท่านโดยเร็วที่สุด\n\nทางเราขออภัยอย่างสูงสำหรับความไม่สะดวกที่เกิดขึ้นระหว่างการใช้บริการของท่านกับสายการบินเอมิเรตส์ เราให้ความสำคัญกับการใช้บริการของท่าน และหวังเป็นอย่างยิ่งว่าจะได้รับโอกาสให้บริการท่านอีกครั้งในอนาคต", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t20", "airline": "QR", "type": "DPR", "aud": "Passenger", "titleEn": "OFFER FINAL SETTLEMENT DPR", "titleTh": "เสนอเงินชดเชยกระเป๋าเสียหาย (QR)", "subject": "Damaged Baggage reference -", "en": "Dear Passenger,\n\nThank you for reaching out to us regarding your claim. After thoroughly reviewed your claim and consulted with our claim team, I am pleased to inform you that we are offering you a settlement claim of THB xxxx.\n\nTo proceed with the settlement, we kindly request that you reply to this email with your acceptance of the offer. Once we receive your confirmation, we will initiate the necessary process to ensure the prompt delivery of the settlement amount.\n\nWe sincerely apologize for the inconvenience occurred during your recent experience with Qatar Airways. We value your patronage and hope that you will give us another opportunity to serve you in the future.", "th": "เรียนผู้โดยสาร\n\nขอบคุณที่ติดต่อเราเกี่ยวกับการเรียกร้องค่าชดเชยของท่าน หลังจากพิจารณาข้อเรียกร้องของท่านอย่างละเอียดและปรึกษากับทีมงานที่รับผิดชอบแล้ว ทางเรายินดีแจ้งว่าขอเสนอค่าชดเชยเป็นจำนวน xxxx บาท\n\nเพื่อดำเนินการจ่ายค่าชดเชย ขอความกรุณาท่านตอบกลับอีเมลฉบับนี้เพื่อแสดงการยอมรับข้อเสนอ เมื่อเราได้รับการยืนยันจากท่านแล้ว เราจะเริ่มดำเนินการที่จำเป็นเพื่อจ่ายค่าชดเชยให้ท่านโดยเร็วที่สุด\n\nทางเราขออภัยอย่างสูงสำหรับความไม่สะดวกที่เกิดขึ้นระหว่างการใช้บริการของท่านกับสายการบินกาตาร์ แอร์เวย์ส เราให้ความสำคัญกับการใช้บริการของท่าน และหวังเป็นอย่างยิ่งว่าจะได้รับโอกาสให้บริการท่านอีกครั้งในอนาคต", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t21", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Passenger", "titleEn": "REQUEST DOCUMENT FOR DPR CREATION", "titleTh": "ขอเอกสารเพื่อทำ Report DPR", "subject": "Damaged Baggage reference -", "en": "Dear Passenger,\n\nGreeting from handling baggage service of [ airlines ] (Bangkok-Suvarnabhumi Airport),\nWe would like to state again that we are sorry for the baggage irregularity you have experienced. We would like to inform you on our damaged baggage processes. In the hope of compensating your grievance, your baggage damage information will be forwarded to the relevant unit Department and your file will be review and evaluated ,we kindly ask you to send us the following documents\n\n• A photograph or scanned image of your Passport\n• 3-4 Photographs of the damaged part\n• A photograph or scanned image of your boarding pass\n• A photograph or scanned image of your baggage tag\n• Purchase invoice for damaged baggage\n• Baggage details brand, Age , cost of baggage\n\nBesides, if you have any questions, you can also contact us through this page. We wish you do not encounter any problems in your future travels.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ [ สายการบิน ] ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\nทางเราขออภัยอีกครั้งสำหรับความผิดปกติเกี่ยวกับสัมภาระที่ท่านประสบ และขอชี้แจงขั้นตอนการดำเนินการกรณีสัมภาระเสียหาย เพื่อเป็นการเยียวยาความเดือดร้อนของท่าน ข้อมูลความเสียหายของสัมภาระจะถูกส่งต่อให้หน่วยงานที่เกี่ยวข้องเพื่อพิจารณาและประเมินผล ขอความกรุณาท่านส่งเอกสารดังต่อไปนี้ให้เรา\n\n• ภาพถ่ายหรือภาพสแกนหนังสือเดินทาง\n• ภาพถ่ายส่วนที่เสียหาย 3-4 ภาพ\n• ภาพถ่ายหรือภาพสแกนบัตรโดยสาร\n• ภาพถ่ายหรือภาพสแกนป้ายสัมภาระ (Baggage Tag)\n• ใบเสร็จรับเงินหรือหลักฐานการซื้อสัมภาระที่เสียหาย\n• รายละเอียดสัมภาระ ได้แก่ ยี่ห้อ อายุการใช้งาน และราคา\n\nนอกจากนี้ หากท่านมีข้อสงสัยประการใด สามารถติดต่อเราได้ตลอดเวลา เราหวังว่าการเดินทางครั้งต่อไปของท่านจะปราศจากปัญหาใด ๆ", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t22", "airline": "ALL AIRLINES", "type": "TRANSFER COMPENSATE", "aud": "Passenger", "titleEn": "WESTERN UNION (MTCN)", "titleTh": "แจ้งหมายเลข MTCN WESTERN UNION", "subject": "Damaged Baggage reference - | Delayed Baggage reference -", "en": "Dear Passenger,\n\n      Refer as your XXXXX reference : on Baggage with XXXXXXXX,\n\nNow we already transfer claim settlement with Western Union (Tracking MTCN : XXXXXXXX),\nSo passenger can claim a settlement at nearby Western Union agent, Please prepared document as list below;\n\n      1. Citizen ID\n      2. Tracking MTCN\n\n(Picture From Western Union Tracking)\n\nSorry for any inconvenience that happened. We look forward to hearing from you soon.", "th": "เรียนผู้โดยสาร\n\n      อ้างถึงหมายเลขอ้างอิง XXXXX เกี่ยวกับสัมภาระหมายเลข XXXXXXXX\n\nขณะนี้ทางเราได้โอนเงินค่าชดเชยผ่านบริการ Western Union แล้ว (หมายเลขติดตาม MTCN : XXXXXXXX)\nผู้โดยสารสามารถรับเงินค่าชดเชยได้ที่ตัวแทน Western Union ใกล้บ้านท่าน โดยกรุณาเตรียมเอกสารดังต่อไปนี้\n\n      1. บัตรประจำตัวประชาชน\n      2. หมายเลขติดตาม MTCN\n\n(ภาพจากหน้าติดตามของ Western Union)\n\nทางเราขออภัยในความไม่สะดวกที่เกิดขึ้น และหวังเป็นอย่างยิ่งว่าจะได้รับการติดต่อกลับจากท่านในเร็ววัน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t23", "airline": "ALL AIRLINES", "type": "FOUND PROPERTY", "aud": "Passenger", "titleEn": "FOUND PROPERTY CAN'T BE FOUND OR TRACE", "titleTh": "แจ้งสิ่งของหลงลืมหาไม่เจอ", "subject": "", "en": "Dear Passenger,\n\nGreeting from handling baggage service of [ airlines ] (Bangkok-Suvarnabhumi Airport),\nWe are sorry for the problem you have experienced. We have made inquiries regarding your lost property, but unfortunately, your property has not been found in the areas for which we, as the airlines, are responsible.\nWe would like to remind you that you can also apply to the Lost and Found of the airport operators in case you forget your property at points outside our responsibility at the airport.\n\nWe hope you do not encounter similar problems in your future travels.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของ [ สายการบิน ] ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\nทางเราขออภัยในปัญหาที่ท่านประสบ เราได้ตรวจสอบเกี่ยวกับทรัพย์สินที่สูญหายของท่านแล้ว แต่น่าเสียดายที่ไม่พบทรัพย์สินดังกล่าวในพื้นที่ที่อยู่ในความรับผิดชอบของสายการบิน\nขอเรียนแจ้งเพิ่มเติมว่า กรณีท่านลืมทรัพย์สินไว้ ณ จุดอื่นที่อยู่นอกเหนือความรับผิดชอบของสายการบินภายในท่าอากาศยาน ท่านสามารถติดต่อแจ้งความประสงค์ได้ที่ฝ่ายทรัพย์สินสูญหาย (Lost and Found) ของผู้ให้บริการท่าอากาศยาน\n\nเราหวังเป็นอย่างยิ่งว่าการเดินทางครั้งต่อไปของท่านจะไม่ประสบปัญหาในลักษณะเดียวกันนี้อีก", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t24", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Airline / Station", "titleEn": "MAIL FOR TRACING WITH CONCERNED STATION", "titleTh": "แจ้งตามกระเป๋ากับ Station อื่น", "subject": "Initial Tracing – Delayed Baggage Case :", "en": "Dear XXXXX,\n\n    Please kindly recheck possible area on case AHL XXXXXXX for us if any update please update to us back. Please see below for details;", "th": "เรียน XXXXX\n\n      ขอความกรุณาตรวจสอบพื้นที่ที่เป็นไปได้สำหรับเคส AHL XXXXXXX อีกครั้ง หากมีความคืบหน้าประการใด ขอความกรุณาแจ้งกลับให้เราทราบ รายละเอียดดังต่อไปนี้", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t25", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Airline / Station", "titleEn": "MAIL FOR FINAL SETTLEMENT ASSISTANCE", "titleTh": "แจ้งทางสายการบินให้ช่วย Offer Final Settlement ให้ผู้โดยสาร", "subject": "Final Settlement Assistance – Baggage Damage Case :", "en": "Dear XXXX Team,\n\n    Please find attached the documentation for baggage damage case DPR XXXXXX. Kindly assist by offering the final settlement claim to the passenger.\nShould you require any additional information or support documents, please let us know.\nThank you for your kind cooperation.", "th": "เรียน ทีม XXXX\n\n      โปรดดูเอกสารแนบสำหรับเคสสัมภาระเสียหายหมายเลข DPR XXXXXX ขอความกรุณาช่วยดำเนินการเสนอค่าชดเชยขั้นสุดท้ายให้แก่ผู้โดยสาร\nหากท่านต้องการข้อมูลหรือเอกสารประกอบเพิ่มเติม กรุณาแจ้งให้ทราบ\nขอขอบพระคุณในความร่วมมือเป็นอย่างสูง", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t26", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Airline / Station", "titleEn": "MAIL FOR FINAL SETTLEMENT TRANSFER", "titleTh": "แจ้งทางสายการบินให้ช่วย Transfer Final Settlement ให้ผู้โดยสาร", "subject": "Final Settlement Assistance – Baggage Damage Case :", "en": "Dear XX Team,\n\n    Please find attached the documentation for baggage damage case DPR XXXXXX. Kindly assist by transfer the final settlement claim to the passenger amount of XXXXX.\n\n  Should you require any additional information or support documents, please let us know.", "th": "เรียน ทีม XX\n\n      โปรดดูเอกสารแนบสำหรับเคสสัมภาระเสียหายหมายเลข DPR XXXXXX ขอความกรุณาช่วยดำเนินการโอนค่าชดเชยขั้นสุดท้ายให้แก่ผู้โดยสารเป็นจำนวน XXXXX\n\n  หากท่านต้องการข้อมูลหรือเอกสารประกอบเพิ่มเติม กรุณาแจ้งให้ทราบ", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t27", "airline": "ALL AIRLINES", "type": "FORWARD", "aud": "Airline / Station", "titleEn": "MAIL FOR AUTHORIZATION UPLIFT", "titleTh": "แจ้งสายการบินขอนำ RUSH TAG ขึ้น", "subject": "Please authorize uplift 1 baggage onboard on flight XXXXX", "en": "Dear XX Team,\n\n    We kindly request your authorization to uplift 1 baggage that onboard on flight (RUSH FLIGHT). This baggage is associated with a AHL xxxxxx. Due (REASON OF DELAYED).\nThe AHL passenger is currently on board flight (PAX BOARD FLIGHT), and we require your assistance to facilitate the return of the baggage to the rightful owner.\nPlease refer to the details below for further information. Your support in resolving this matter is greatly appreciated.", "th": "เรียน ทีม XX\n\n      ขอความกรุณาอนุมัตินำสัมภาระ 1 ใบที่อยู่บนเที่ยวบิน (RUSH FLIGHT) ขึ้นเครื่อง สัมภาระดังกล่าวเกี่ยวข้องกับเคส AHL xxxxxx เนื่องจาก (สาเหตุที่ล่าช้า)\nขณะนี้ผู้โดยสารเคส AHL อยู่บนเที่ยวบิน (PAX BOARD FLIGHT) และเราจำเป็นต้องขอความช่วยเหลือจากท่านเพื่ออำนวยความสะดวกในการส่งสัมภาระคืนแก่เจ้าของ\nรายละเอียดเพิ่มเติมมีดังต่อไปนี้ ขอขอบพระคุณในความช่วยเหลือของท่านเป็นอย่างสูง", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t28", "airline": "ALL AIRLINES", "type": "FORWARD", "aud": "Airline / Station", "titleEn": "MAIL FOR AUTHORIZATION UPLIFT AND PRINT RUSH TAG", "titleTh": "แจ้งสายการบินขอนำ RUSH TAG ขึ้น + ปริ้น RUSH TAG", "subject": "Please print rush tag and authorize uplift 1 baggage onboard on flight XXXXX", "en": "Dear XX Team,\n\n    We kindly request your authorization to print rush tag and uplift 1 baggage that onboard on flight (RUSH FLIGHT). This baggage is associated with a AHL xxxxxx. Due (REASON OF DELAYED).\nThe AHL passenger is currently on board flight (PAX BOARD FLIGHT), and we require your assistance to facilitate the return of the baggage to the rightful owner.\nPlease refer to the details below for further information. Your support in resolving this matter is greatly appreciated.", "th": "เรียน ทีม XX\n\n      ขอความกรุณาอนุมัติให้พิมพ์ Rush Tag และนำสัมภาระ 1 ใบที่อยู่บนเที่ยวบิน (RUSH FLIGHT) ขึ้นเครื่อง สัมภาระดังกล่าวเกี่ยวข้องกับเคส AHL xxxxxx เนื่องจาก (สาเหตุที่ล่าช้า)\nขณะนี้ผู้โดยสารเคส AHL อยู่บนเที่ยวบิน (PAX BOARD FLIGHT) และเราจำเป็นต้องขอความช่วยเหลือจากท่านเพื่ออำนวยความสะดวกในการส่งสัมภาระคืนแก่เจ้าของ\nรายละเอียดเพิ่มเติมมีดังต่อไปนี้ ขอขอบพระคุณในความช่วยเหลือของท่านเป็นอย่างสูง", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t29", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "MAIL FOR INFORMED FORWARD BAGGAGE TO PASSENGER NEARBY AIRPORT", "titleTh": "แจ้งผู้โดยสารส่งกระเป๋าไปยังสนามบินใกล้เคียง", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nWe acknowledge your message regarding your delayed baggage (Reference: xxxxxxxx).\n\nPlease be informed that your baggage will be forwarded to xxxxxx Airport on (Airlines) flight xxxx , dated xxxxxx, with an estimated arrival time of xxxxxxx.\n\nYou may collect your baggage at xxxxxxxx Airport. Kindly contact xxxxxxx staff at the airport for assistance upon arrival.\n\nThank you for your understanding, and we apologize for any inconvenience caused.", "th": "เรียนผู้โดยสาร\n\nทางเราได้รับข้อความของท่านเกี่ยวกับสัมภาระล่าช้า (หมายเลขอ้างอิง: xxxxxxxx) เรียบร้อยแล้ว\n\nขอแจ้งให้ท่านทราบว่าสัมภาระของท่านจะถูกส่งต่อไปยังท่าอากาศยาน xxxxxx ด้วยเที่ยวบิน (สายการบิน) xxxx วันที่ xxxxxx คาดว่าจะถึงเวลา xxxxxxx\n\nท่านสามารถรับสัมภาระได้ที่ท่าอากาศยาน xxxxxxxx โดยกรุณาติดต่อเจ้าหน้าที่ xxxxxxx ณ ท่าอากาศยานเพื่อขอรับความช่วยเหลือเมื่อเดินทางถึง\n\nขอขอบคุณในความเข้าใจของท่าน และขออภัยในความไม่สะดวกที่เกิดขึ้น", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t30", "airline": "ALL AIRLINES", "type": "AHL", "aud": "Passenger", "titleEn": "MAIL FOR CONFIRMATION BAG UNDER PROCESS OF DELIVERY", "titleTh": "แจ้งผู้โดยสารกระเป๋าอยู่ในระหว่างการจัดส่ง", "subject": "Delayed Baggage reference -", "en": "Dear Passenger,\n\nWe acknowledge your message regarding your delayed baggage (Reference: XXXXXX). We would like to inform you that your baggage is now scheduled for delivery to your provided address.\n\nNormally, the delivery process takes approximately XX hours upon to custom clearance process and traffic condition. Our courier will contact XXXX upon arrival.\n\nThank you for your patience and understanding.", "th": "เรียนผู้โดยสาร\n\nทางเราได้รับข้อความของท่านเกี่ยวกับสัมภาระล่าช้า (หมายเลขอ้างอิง: XXXXXX) เรียบร้อยแล้ว ขอแจ้งให้ท่านทราบว่าสัมภาระของท่านอยู่ระหว่างการนำส่งตามที่อยู่ที่ท่านระบุ\n\nโดยปกติการจัดส่งใช้เวลาประมาณ XX ชั่วโมง ทั้งนี้ขึ้นอยู่กับขั้นตอนการผ่านพิธีการศุลกากรและสภาพการจราจร พนักงานจัดส่งจะติดต่อ XXXX เมื่อถึงที่หมาย\n\nขอขอบคุณในความอดทนรอและความเข้าใจของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t31", "airline": "QR", "type": "DPR", "aud": "Passenger", "titleEn": "ADVISE PASSENGER CREATION CASE IN WEBSITE", "titleTh": "แจ้งผู้โดยสารแนะนำให้ติดต่อ REPORT บน WEBSITE QR", "subject": "Damaged Baggage reference -", "en": "Dear Passenger,\nGreetings from the Baggage Handling Service Team at Qatar Airways (Bangkok – Suvarnabhumi Airport).\nWe sincerely apologize for the inconvenience caused by the baggage irregularity you have experienced. To assist you further, we would like to inform you about our damaged baggage process.\nYour baggage damage details will be forwarded to the relevant department for review and evaluation. In order to proceed, we kindly ask you to complete the Mishandled Baggage Report using the link below:\n\nhttps://haqiba.qatarairways.com.qa/Haqiba\n\nThank you for your cooperation and understanding. Should you have any questions or require assistance, please do not hesitate to contact us.", "th": "เรียนผู้โดยสาร\nขอแสดงความนับถือจากทีมบริการจัดการสัมภาระของสายการบินกาตาร์ แอร์เวย์ส (ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ)\nทางเราขออภัยเป็นอย่างสูงสำหรับความไม่สะดวกจากความผิดปกติเกี่ยวกับสัมภาระที่ท่านประสบ เพื่อให้ความช่วยเหลือท่านต่อไป ขอชี้แจงขั้นตอนการดำเนินการกรณีสัมภาระเสียหาย\nข้อมูลความเสียหายของสัมภาระท่านจะถูกส่งต่อให้หน่วยงานที่เกี่ยวข้องเพื่อพิจารณาและประเมินผล เพื่อให้ดำเนินการต่อได้ ขอความกรุณาท่านกรอกแบบรายงานสัมภาระที่ได้รับการจัดการผิดปกติ (Mishandled Baggage Report) ผ่านลิงก์ด้านล่างนี้\n\nhttps://haqiba.qatarairways.com.qa/Haqiba\n\nขอขอบพระคุณในความร่วมมือและความเข้าใจของท่าน หากมีข้อสงสัยหรือต้องการความช่วยเหลือ กรุณาอย่าลังเลที่จะติดต่อเรา", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t32", "airline": "ALL AIRLINES", "type": "FOUND PROPERTY", "aud": "Passenger", "titleEn": "FOUND PROPERTY POSSIBLE MATCH", "titleTh": "แจ้งผู้โดยสารว่ามีเจอของหลงลืมบนเครื่องที่คาดว่าจะตรงกับที่ตามหา", "subject": "", "en": "Dear Passenger,\n\n    We have checked with the airline and located one item that may match your description. Please review the attached photo to confirm if this is your property and reply to us at your earliest convenience.\n\nThank you for your cooperation.", "th": "เรียนผู้โดยสาร\n\n      เราได้ตรวจสอบกับสายการบินแล้ว และพบสิ่งของ 1 รายการที่อาจตรงกับรายละเอียดที่ท่านแจ้ง ขอความกรุณาท่านตรวจสอบภาพถ่ายที่แนบมาเพื่อยืนยันว่าเป็นทรัพย์สินของท่านหรือไม่ และตอบกลับให้เราทราบโดยเร็วที่สุด\n\nขอขอบพระคุณในความร่วมมือของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t33", "airline": "ALL AIRLINES", "type": "FORWARD", "aud": "Airline / Station", "titleEn": "INFORMED SORTING FOR FORWARDING MHB BAG", "titleTh": "แจ้ง SORTING เกี่ยวกับ RUSH BAG", "subject": "Mishandled Baggage Report Flt", "en": "Dear Sorting,\n\n    We acknowledged your messaged as well, Kindly informed that we will forward baggage as rush on board (FLIGHT DATE). Kindly see mentioned details below for reference;", "th": "เรียน ฝ่าย Sorting\n\n      ทางเราได้รับทราบข้อความของท่านเรียบร้อยแล้ว ขอแจ้งให้ทราบว่าเราจะส่งต่อสัมภาระเป็น Rush บนเที่ยวบิน (วันที่เที่ยวบิน) รายละเอียดอ้างอิงมีดังต่อไปนี้", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t34", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Passenger", "titleEn": "INFORMED FILE REFERENCE FOR INSURANCE WITH INSURANCE DOCUMENT", "titleTh": "แจ้งผู้โดยสารหมายเลข RERPORT DPR + เอกสาร ไว้สำหรับเคลมประกัน", "subject": "Damaged Baggage reference for Insurance purpose -", "en": "Dear Passenger,\n\nGreetings from the Baggage Handling Service of XXXXXX Airlines at Bangkok Suvarnabhumi Airport.\n\nRegarding your damaged baggage claim with insurance under reference xxxxxxxx, please find the attached documents required for your claim.\n\nWe sincerely apologize for the inconvenience caused. Should you have any further questions or require assistance, please do not hesitate to contact us.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของสายการบิน XXXXXX ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nอ้างถึงการเรียกร้องค่าชดเชยสัมภาระเสียหายเพื่อใช้ประกอบการเคลมประกัน หมายเลขอ้างอิง xxxxxxxx โปรดดูเอกสารแนบซึ่งจำเป็นสำหรับการเคลมของท่าน\n\nทางเราขออภัยเป็นอย่างสูงในความไม่สะดวกที่เกิดขึ้น หากท่านมีข้อสงสัยหรือต้องการความช่วยเหลือเพิ่มเติม กรุณาอย่าลังเลที่จะติดต่อเรา", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t35", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Passenger", "titleEn": "INFORMED FILE REFERENCE FOR INSURANCE", "titleTh": "แจ้งผู้โดยสารหมายเลข RERPORT DPR ไว้สำหรับเคลมประกัน", "subject": "Damaged Baggage reference for Insurance purpose -", "en": "Dear Passenger,\n\nGreetings from the Baggage Handling Service of XXXXXX Airlines at Bangkok Suvarnabhumi Airport.\n\nRegarding your damaged baggage claim with insurance, Your file reference for damaged baggage report is XXXXXXX.\n\nWe sincerely apologize for the inconvenience caused. Should you have any further questions or require assistance, please do not hesitate to contact us.", "th": "เรียนผู้โดยสาร\n\nขอแสดงความนับถือจากฝ่ายบริการจัดการสัมภาระของสายการบิน XXXXXX ณ ท่าอากาศยานสุวรรณภูมิ กรุงเทพฯ\n\nอ้างถึงการเรียกร้องค่าชดเชยสัมภาระเสียหายเพื่อใช้ประกอบการเคลมประกัน หมายเลขอ้างอิงรายงานสัมภาระเสียหายของท่านคือ XXXXXXX\n\nทางเราขออภัยเป็นอย่างสูงในความไม่สะดวกที่เกิดขึ้น หากท่านมีข้อสงสัยหรือต้องการความช่วยเหลือเพิ่มเติม กรุณาอย่าลังเลที่จะติดต่อเรา", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t36", "airline": "ALL AIRLINES", "type": "FOUND PROPERTY", "aud": "Passenger", "titleEn": "FOUND PROPERTY REQUEST INFORMATION", "titleTh": "ขอข้อมูลเพิ่มเติมผู้โดยสารเกี่ยวกับสัมภาระหลงลืมบนเครื่องบิน", "subject": "Lost property on flight xxxxx", "en": "Dear Passenger,\nAs per your recent call regarding a found property on xxxxx flight, we kindly request you to provide the following details:\n\nDescription of your lost property\nYour flight details\nPhoto of the belonging (if available)\n\nOnce we receive this information, we will forward it to the concerned department for further assistance.\nThank you for your cooperation.", "th": "เรียนผู้โดยสาร\nจากการที่ท่านได้โทรติดต่อเราเมื่อไม่นานมานี้เกี่ยวกับทรัพย์สินที่พบบนเที่ยวบิน xxxxx ขอความกรุณาท่านให้ข้อมูลดังต่อไปนี้\n\n• รายละเอียดของทรัพย์สินที่สูญหาย\n• รายละเอียดเที่ยวบินของท่าน\n• ภาพถ่ายของสิ่งของ (หากมี)\n\nเมื่อได้รับข้อมูลแล้ว เราจะส่งต่อให้หน่วยงานที่เกี่ยวข้องเพื่อดำเนินการช่วยเหลือต่อไป\nขอขอบพระคุณในความร่วมมือของท่าน", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t37", "airline": "ALL AIRLINES", "type": "DPR", "aud": "Airline / Station", "titleEn": "MAIL FOR NOTIFY FINAL SETTLEMENT ACCEPTED ON ARRIVAL", "titleTh": "แจ้งสายการบินว่าผู้โดยสารได้รับเงินชดเชย DPR ที่เคาน์เตอร์ขาเข้าเรียบร้อยแล้ว", "subject": "Final Settlement Notify – Baggage Damage Case :", "en": "Dear XX Team,\n\n    Please find attached the documentation for baggage damage case DPR XXXXXX. Passenger already accepted final settlement xxxxxx on arrival.\n\nShould you require any additional information or support documents, please let us know.\n\nThank you for your kind cooperation.", "th": "เรียน ทีม XX\n\n      โปรดดูเอกสารแนบสำหรับเคสสัมภาระเสียหายหมายเลข DPR XXXXXX ผู้โดยสารได้ยอมรับค่าชดเชยขั้นสุดท้ายจำนวน xxxxxx ณ จุดขาเข้าเรียบร้อยแล้ว\n\nหากท่านต้องการข้อมูลหรือเอกสารประกอบเพิ่มเติม กรุณาแจ้งให้ทราบ\n\nขอขอบพระคุณในความร่วมมือเป็นอย่างสูง", "thAuto": true, "titleThAuto": false, "hist": []}, {"id": "t38", "airline": "QR", "type": "DPR", "aud": "Airline / Station", "titleEn": "MAIL const todayStr=()=>dayKey(new Date().toISOString());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function copy(txt){(navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast("Copied ✓"),()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied ✓")}catch(e){toast("Copy failed")}a.remove()})}
function hl(text,q){const s=esc(text);if(!q)return s;let out=s;q.split(/\s+/).filter(Boolean).forEach(t=>{const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/&/g,"&amp;")+")","ig");out=out.replace(re,"<mark>$1</mark>")});return out}

/* ============ MODAL ============ */
function modal(html,onMount){
  const bg=document.createElement("div");bg.className="modalbg";bg.innerHTML=`<div class="modal">${html}</div>`;
  const close=()=>bg.remove();
  bg.addEventListener("mousedown",e=>{if(e.target===bg)close()});
  bg.addEventListener("click",e=>{if(e.target.closest("[data-close]"))close()});
  document.body.appendChild(bg);onMount&&onMount(bg,close);return close;
}

/* ============ PAGINATION ============ */
const PER=30;
function pagerHTML(total,page){
  const pages=Math.ceil(total/PER);if(pages<=1)return"";
  const set=[...new Set([1,pages,page-1,page,page+1])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);let last=0;
  let o=`<button class="btn sm" data-pg="${page-1}" ${page<=1?"disabled":""}>‹ Prev</button>`;
  set.forEach(n=>{if(n-last>1)o+=`<span class="pgd">…</span>`;o+=`<button class="btn sm ${n===page?"pri":""}" data-pg="${n}">${n}</button>`;last=n});
  return `<div class="pager">${o}<button class="btn sm" data-pg="${page+1}" ${page>=pages?"disabled":""}>Next ›</button></div>`;
}
function pageInfo(total,page){const pages=Math.max(1,Math.ceil(total/PER)),p=Math.min(Math.max(1,page),pages),a=(p-1)*PER;return{pages,p,a,b:Math.min(total,a+PER)}}

      if(!id){n.id=uid("t");n.ord=-Date.now()}

function mountLog(root,cfg){

  const recs=()=>DB[cfg.key];

      if(F.from&&d<F.from)return false;if(F.to&&d>F.to)return false;if(F.st&&r.status!==F.st)return false;if(F.topic&&r.topic!==F.topic)return false;

  }
  function bars(items,color){const max=Math.max(1,...items.map(i=>i[1]));
    return `<svg viewBox="0 0 420 ${items.length*26+4}" width="100%" role="img">${items.map((it,i)=>`<text x="0" y="${i*26+16}" font-size="11" fill="currentColor">${esc(it[0].length>26?it[0].slice(0,25)+"…":it[0])}</text><rect x="150" y="${i*26+4}" width="${Math.max(2,it[1]/max*230)}" height="16" rx="4" fill="${color}"/><text x="${156+it[1]/max*230}" y="${i*26+17}" font-size="11" fill="currentColor">${it[1]}</text>`).join("")}</svg>`}
  function daily(rs){
    const days=[];let end=F.to?new Date(F.to+"T00:00"):new Date();let start=F.from?new Date(F.from+"T00:00"):new Date(end.getTime()-13*864e5);
    if((end-start)/864e5>30)start=new Date(end.getTime()-30*864e5);
    for(let d=new Date(start);d<=end;d=new Date(d.getTime()+864e5))days.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
    const cnt=Object.fromEntries(days.map(d=>[d,0]));rs.forEach(r=>{const k=dayKey(r.ts);if(k in cnt)cnt[k]++});

  }
  function form(r){
    const x=r||{topic:cfg.topics[0],status:"Pending",contact:"",rtype:"",ref:"",remark:""};
    modal(`<div class="mhead"><h3>${r?"Edit":"New"} record · ${cfg.label}</h3><button class="btn sm x" data-close>✕</button></div>
    <div class="note" style="background:var(--soft);border-color:var(--line);color:var(--ink)">🕒 ${r?"Created "+fmt(r.ts):"Timestamp is recorded automatically on save"}</div>
    <div class="fg">${cfg.contact?`<div class="full"><label>1. Contact Number / Department *</label><input id="f-contact" value="${esc(x.contact)}"></div>`:""}
    <div class="full"><label>${cfg.contact?"2":"1"}. Topic of contacting *</label><select id="f-topic">${cfg.topics.map(t=>`<option${t===x.topic?" selected":""}>${esc(t)}</option>`).join("")}</select></div>

      };
    });
  }

          const canvas=await html2canvas(copy,{scale:SC,backgroundColor:"#ffffff",useCORS:true,scrollX:0,scrollY:0,windowWidth:W});
          const pdf=new jspdf.jsPDF({orientation:landscape?"landscape":"portrait",unit:"mm",format:"a4"});
          const M=6,pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),mm=(pw-2*M)/canvas.width,slice=Math.floor((ph-2*M)/mm);
          let y=0,first=true;
          while(y<canvas.height){
            let end=Math.min(y+slice,canvas.height);
            if(end<canvas.height){const fit=edges.filter(v=>v>y+slice*.4&&v<=end);if(fit.length)end=Math.max(...fit)}
            const part=document.createElement("canvas");part.width=canvas.width;part.height=end-y;
            const cx=part.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,part.width,part.height);cx.drawImage(canvas,0,y,canvas.width,end-y,0,0,canvas.width,end-y);
            if(!first)pdf.addPage();pdf.addImage(part.toDataURL("image/jpeg",.95),"JPEG",M,M,pw-2*M,(end-y)*mm);first=false;y=end;
          }
          pdf.save(name);toast("PDF ready ✓");
        }finally{holder.remove()}
      }catch(err){toast("Could not create the PDF — try Print instead")}
      btn.disabled=false;btn.textContent=old;
    };
  });
}
async function importLegacySorting(){
  if(!confirm("Import records from the previous Sorting cloud (project sortingtbt-b32b7) into this platform?\nRecords already here are kept; photos are converted automatically."))return;
  try{
    if(!window.firebase||!firebase.firestore)throw new Error("Cloud SDK not loaded (offline?)");
    let app;try{app=firebase.app("legacy")}catch(e){app=firebase.initializeApp(LEGACY_CFG,"legacy")}
    toast("Reading old cloud…");
    const snap=await app.firestore().collection("baggage_records").get();let n=0;
    for(const d of snap.docs){
      const r=d.data();if(!r.id||isMockRec(r)||DB.sorting.some(x=>x.id===r.id))continue;
      const o={...r};
      if(o.photo&&String(o.photo).startsWith("data:")){try{o.thumb=await makeThumb(o.photo);o.hasPhoto=true;setPhoto(o.id,o.photo)}catch(e){}}
      delete o.photo;putItem("sorting",o);n++;
    }

  }catch(e){toast("Import failed: "+(e.code||e.message))}
}

function buildIndex(){
  const ix=[];
  SECTIONS.forEach(s=>ix.push({sec:s.id,secName:s.short,title:s.name,sub:s.desc,crumb:"Section",text:(s.name+" "+s.desc+" "+s.kw).toLowerCase(),go:()=>go(s.id)}));
  DB.templates.forEach(t=>ix.push({sec:"email",secName:"Email Templates",title:t.titleEn+(t.titleTh?" · "+t.titleTh:""),sub:(t.subject?"Subject: "+t.subject+" — ":"")+t.en.replace(/\s+/g," ").slice(0,110),crumb:`Email Templates › ${airLabel(t.airline)} › ${t.type}`,text:[t.airline,airLabel(t.airline),t.type,t.aud,t.titleEn,t.titleTh,t.subject,t.en,t.th].join(" ").toLowerCase(),go:()=>go("email",{tpl:t.id})}));
  ["phone","office"].forEach(k=>DB[k].forEach(r=>ix.push({sec:"contact",secName:"Contact History",title:`${r.ref||"(no case ref)"} — ${r.topic}`,sub:`${r.contact?r.contact+" · ":""}${r.status} · ${r.remark||""}`.slice(0,120),crumb:`Contact History › ${CFG[k].label} › ${fmt(r.ts)}`,text:[r.ref,r.contact,r.topic,r.rtype,r.remark,r.status,CFG[k].label,"contact history"].join(" ").toLowerCase(),go:()=>go("contact",{tab:k,q:r.ref||r.contact||""})})));
  DB.sorting.filter(r=>!isMockRec(r)).forEach(r=>{const cm=(r.history||[]).filter(x=>/^(Comment|Note):/.test(x.text)).map(x=>x.text);ix.push({sec:"sorting",secName:"Sorting Bag Record",title:`${r.tagNumber} — ${r.flightNumber} (${r.flightDate})`,sub:`${r.color||""} · ${r.status} · AHL/Email: ${r.ahlCase||"—"}${cm.length?" · "+cm[cm.length-1]:""}`.slice(0,140),crumb:`Sorting Bag Record › Dashboard › ${r.createdAt||""}`,text:[r.tagNumber,r.flightNumber,r.flightDate,r.color,r.ahlCase,r.status,(r.history||[]).map(x=>x.text).join(" "),"sorting bag record tbt"].join(" ").toLowerCase(),go:()=>go("sorting",{q:r.tagNumber})})});
  return ix;
}
let gItems=[],gAct=-1;
const gq=$("#gq"),gres=$("#gres");
function gsearch(){
  const q=gq.value.trim().toLowerCase();
  if(!q){gres.classList.remove("on");return}
  const w=q.split(/\s+/);
  gItems=buildIndex().map(i=>({i,s:w.every(x=>i.text.includes(x))?(w.some(x=>i.title.toLowerCase().includes(x))?2:1)+(i.crumb==="Section"?1:0):0})).filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>x.i);
  const counts={};gItems.forEach(i=>counts[i.secName]=(counts[i.secName]||0)+1);
  const shown=gItems.slice(0,40);gAct=-1;
  gres.innerHTML=shown.length?`<div class="gh"><b>${gItems.length} result(s)</b> ${Object.entries(counts).map(([k,v])=>`<span class="chip">${esc(k)}: ${v}</span>`).join("")}</div>`+shown.map((it,n)=>`<div class="it" data-n="${n}"><div class="t"><span class="src s-${it.sec}">${esc(it.secName)}</span>${hl(it.title,q)}</div><div class="crumb">📍 ${esc(it.crumb)}</div><div class="s">${hl(it.sub,q)}</div></div>`).join(""):`<div class="empty">No results for “${esc(gq.value)}”.</div>`;
  gres.classList.add("on");
}
gq.addEventListener("input",gsearch);gq.addEventListener("focus",gsearch);
gq.addEventListener("keydown",e=>{
  const its=$$(".it",gres);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();gAct=Math.max(0,Math.min(its.length-1,gAct+(e.key==="ArrowDown"?1:-1)));its.forEach((x,n)=>x.classList.toggle("act",n===gAct));its[gAct]?.scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"&&gItems.length){e.preventDefault();pick(gAct<0?0:gAct)}
  if(e.key==="Escape"){gres.classList.remove("on");gq.blur()}
});
function pick(n){const it=gItems[n];gres.classList.remove("on");it?.go()}
gres.addEventListener("mousedown",e=>{const it=e.target.closest(".it");if(it){e.preventDefault();pick(+it.dataset.n)}});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))gres.classList.remove("on")});

/* ============ VERSION / DATA / THEME ============ */
$("#verNum").textContent=VERSION;$("#vtag").textContent="v"+VERSION;
$("#verBtn").onclick=()=>modal(`<div class="mhead"><h3>Update history</h3><button class="btn sm x" data-close>✕</button></div><p style="color:var(--mut);margin-top:0">Current version: <b>v${VERSION}</b></p>${CHANGELOG.map(c=>`<div><span class="vb">v${c.v}</span> <small>${c.d}</small><ul class="hist">${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}`);
$("#dataBtn").onclick=()=>modal(`<div class="mhead"><h3>Data &amp; backup</h3><button class="btn sm x" data-close>✕</button></div>
 <p style="color:var(--mut)">Data is stored in this browser. Export a backup regularly, or import one to move data to another computer.</p>
 <div class="row"><button class="btn pri" id="d-exp">⬇ Export backup (JSON)</button><label class="btn" style="margin:0">⬆ Import backup<input id="d-imp" type="file" accept=".json,application/json" hidden></label><button class="btn danger" id="d-reset">↺ Reset email templates to original</button></div>`,(bg,close)=>{
  $("#d-exp",bg).onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=`bfs-info-center-backup-${todayStr()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  $("#d-imp",bg).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.templates)throw 0;if(confirm("Replace all current data with this backup?")){replaceAll(d);close();toast("Imported ✓")}}catch(x){toast("Invalid backup file")}};r.readAsText(f)};
  $("#d-reset",bg).onclick=()=>{if(confirm("Discard all template edits and restore the original 50 templates? Contact records are kept.")){resetTemplates();close();toast("Templates reset")}};
});
$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark"};
render();
initCloud();
</script>
