  <div><small>Topic</small><select data-f="topic"><option value="">All</option>${cfg.topics.map(s=>`<option>${esc(s)}</option>`).join("")}</select></div><div><small>&nbsp;</small><button class="btn" data-act="clear">Clear</button></div></div>
  <div class="tiles"></div><div class="charts"></div><div class="row" style="justify-content:space-between;margin:6px 0"><span class="meta" id="cnt" style="margin:0"></span><button class="btn sm" data-act="csv">⬇ Export CSV</button></div><div class="tw"></div><div class="pgw"></div>`;
  const recs=()=>DB[cfg.key];
  function filtered(){
    const q=F.q.toLowerCase().trim();
    return recs().filter(r=>{const d=dayKey(r.ts);
      if(F.from&&d<F.from)return false;if(F.to&&d>F.to)return false;if(F.st&&r.status!==F.st)return false;if(F.topic&&r.topic!==F.topic)return false;
      if(q&&!((r.ref||"").toLowerCase().includes(q)||(cfg.contact&&(r.contact||"").toLowerCase().includes(q))))return false;return true}).sort((a,b)=>b.ts.localeCompare(a.ts));
  }
  function bars(items,color){const max=Math.max(1,...items.map(i=>i[1]));
    return `<svg viewBox="0 0 420 ${items.length*26+4}" width="100%" role="img">${items.map((it,i)=>`<text x="0" y="${i*26+16}" font-size="11" fill="currentColor">${esc(it[0].length>26?it[0].slice(0,25)+"…":it[0])}</text><rect x="150" y="${i*26+4}" width="${Math.max(2,it[1]/max*230)}" height="16" rx="4" fill="${color}"/><text x="${156+it[1]/max*230}" y="${i*26+17}" font-size="11" fill="currentColor">${it[1]}</text>`).join("")}</svg>`}
  function daily(rs){
    const days=[];let end=F.to?new Date(F.to+"T00:00"):new Date();let start=F.from?new Date(F.from+"T00:00"):new Date(end.getTime()-13*864e5);
    if((end-start)/864e5>30)start=new Date(end.getTime()-30*864e5);
    for(let d=new Date(start);d<=end;d=new Date(d.getTime()+864e5))days.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
    const cnt=Object.fromEntries(days.map(d=>[d,0]));rs.forEach(r=>{const k=dayKey(r.ts);if(k in cnt)cnt[k]++});
    const max=Math.max(1,...Object.values(cnt)),w=420/days.length;
    return `<svg viewBox="0 0 420 150" width="100%" role="img">${days.map((d,i)=>{const h=cnt[d]/max*100;return `<rect x="${i*w+2}" y="${116-h}" width="${Math.max(2,w-4)}" height="${h}" rx="3" fill="#0e6fc0"><title>${d}: ${cnt[d]}</title></rect>${cnt[d]?`<text x="${i*w+w/2}" y="${112-h}" font-size="10" text-anchor="middle" fill="currentColor">${cnt[d]}</text>`:""}${(days.length<=16||i%Math.ceil(days.length/10)===0)?`<text x="${i*w+w/2}" y="132" font-size="9" text-anchor="middle" fill="currentColor">${d.slice(5)}</text>`:""}`}).join("")}</svg>`;
  }
  function draw(){
    const rs=filtered();const pi=pageInfo(rs.length,F.page);F.page=pi.p;const pageRs=rs.slice(pi.a,pi.b);
    const stc=cfg.statuses.map(s=>[s,rs.filter(r=>r.status===s).length]);
    $(".tiles",root).innerHTML=`<div class="tile"><b>${rs.length}</b><span>Total records</span></div>`+stc.map(s=>`<div class="tile"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("");
    $(".charts",root).innerHTML=`<div class="chart"><h5>Records by topic</h5>${bars(cfg.topics.map(t=>[t,rs.filter(r=>r.topic===t).length]),"#0e6fc0")}</div>
      <div class="chart"><h5>Records per day</h5>${daily(rs)}</div>
      <div class="chart"><h5>Records by status</h5>${bars(stc,"#e8a317")}</div>
      ${cfg.rtype?`<div class="chart"><h5>Records by type of report</h5>${bars([...RTYPES,"None"].map(t=>[t,rs.filter(r=>(r.rtype||"None")===t).length]),"#1d8a4e")}</div>`:`<div class="chart"><h5>Top contact numbers / departments</h5>${bars(Object.entries(rs.reduce((m,r)=>(m[r.contact||"—"]=(m[r.contact||"—"]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,5).concat(rs.length?[]:[["—",0]]),"#1d8a4e")}</div>`}`;
    $("#cnt",root).textContent=`${rs.length?`${pi.a+1}–${pi.b}`:0} of ${rs.length} matching record(s) · page ${pi.p}/${pi.pages}`;$(".pgw",root).innerHTML=pagerHTML(rs.length,F.page);
    $(".tw",root).innerHTML=rs.length?`<table><thead><tr><th>Date / Time</th>${cfg.contact?"<th>Contact no. / Dept</th>":""}<th>Topic</th>${cfg.rtype?"<th>Report</th>":""}<th>Case ref / Tag</th><th>Remark</th><th>Status</th><th></th></tr></thead><tbody>${pageRs.map(r=>`<tr><td class="ts" title="Last updated ${fmt(r.upd||r.ts)}">${fmt(r.ts)}</td>${cfg.contact?`<td>${esc(r.contact)}</td>`:""}<td>${esc(r.topic)}</td>${cfg.rtype?`<td>${esc(r.rtype||"—")}</td>`:""}<td><b>${esc(r.ref||"—")}</b></td><td class="rm">${esc(r.remark)}</td><td><select class="st ${stCls(r.status)}" data-sid="${r.id}">${cfg.statuses.map(s=>`<option${s===r.status?" selected":""}>${s}</option>`).join("")}</select></td><td style="white-space:nowrap"><button class="btn sm" data-edit="${r.id}">✏️</button> <button class="btn sm danger" data-del="${r.id}">🗑</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No records yet — click “New record” to add the first one.</div>`;
  }
  function form(r){
    const x=r||{topic:cfg.topics[0],status:"Pending",contact:"",rtype:"",ref:"",remark:""};
    modal(`<div class="mhead"><h3>${r?"Edit":"New"} record · ${cfg.label}</h3><button class="btn sm x" data-close>✕</button></div>
    <div class="note" style="background:var(--soft);border-color:var(--line);color:var(--ink)">🕒 ${r?"Created "+fmt(r.ts):"Timestamp is recorded automatically on save"}</div>
    <div class="fg">${cfg.contact?`<div class="full"><label>1. Contact Number / Department *</label><input id="f-contact" value="${esc(x.contact)}"></div>`:""}
    <div class="full"><label>${cfg.contact?"2":"1"}. Topic of contacting *</label><select id="f-topic">${cfg.topics.map(t=>`<option${t===x.topic?" selected":""}>${esc(t)}</option>`).join("")}</select></div>
    ${cfg.rtype?`<div class="full"><label>2. Type of Report (not mandatory)</label><select id="f-rtype"><option value="">— None —</option>${RTYPES.map(t=>`<option${t===x.rtype?" selected":""}>${t}</option>`).join("")}</select></div>`:""}
    <div class="full"><label>${cfg.contact?"3":"3"}. Case Reference / Tag Number</label><input id="f-ref" value="${esc(x.ref)}"></div>

      $("#f-save",bg).onclick=()=>{
        const g=i=>$("#"+i,bg)?.value.trim()||"";
        if(cfg.contact&&!g("f-contact")){toast("Contact number / department is required");return}
        const now=new Date().toISOString();

        putItem(cfg.key,n);close();toast("Record saved ✓");
      };
    });
  }
  root.addEventListener("input",e=>{const f=e.target.dataset.f;if(f){F[f]=e.target.value;F.page=1;draw()}});
  root.addEventListener("change",e=>{
    const f=e.target.dataset.f;if(f){F[f]=e.target.value;F.page=1;draw();return}

  root.addEventListener("click",e=>{

            const cx=part.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,part.width,part.height);cx.drawImage(canvas,0,y,canvas.width,end-y,0,0,canvas.width,end-y);
            if(!first)pdf.addPage();pdf.addImage(part.toDataURL("image/jpeg",.95),"JPEG",M,M,pw-2*M,(end-y)*mm);first=false;y=end;
          }
          pdf.save(name);toast("PDF ready ✓");
        }finally{holder.remove()}

async function importLegacySorting(){

  /* ---------- import / export ---------- */
  const ED_HEAD=["Airline Code","Airline Name","Subject","Station","Email","Remark"];
  function exportDir(){

  function parseTable(text){
    const first=(text.split(/\r?\n/).find(l=>l.trim())||"");
    const cnt={"\t":(first.match(/\t/g)||[]).length,";":(first.match(/;/g)||[]).length,",":(first.match(/,/g)||[]).length};
    const d=cnt["\t"]?"\t":cnt[";"]>=cnt[","]&&cnt[";"]?";":",";
    return parseCSV(text,d).map(r=>r.map(c=>c.trim()));
  }
  function normRows(tbl){
    if(!tbl.length)return[];
    const hdr=tbl[0].map(c=>c.toLowerCase().trim());
    const isHdr=hdr.some(c=>/e-?mail/.test(c))&&!hdr.some(c=>c.includes("@"));
    const out=[];
    if(isHdr){
      const f=re=>hdr.findIndex(c=>re.test(c));
      const ix={code:f(/^(airline\s*)?(code|iata)$/),name:f(/^(airline(\s*name)?|name)$/),subject:f(/subject|category/),station:f(/station|group|city/),email:f(/mail/),remark:f(/remark|comment|note/)};
      tbl.slice(1).forEach(r=>{const g=i=>i>=0?(r[i]||""):"";out.push({code:g(ix.code),name:g(ix.name),subject:g(ix.subject),station:g(ix.station),email:g(ix.email),remark:g(ix.remark)})});
    }else tbl.forEach(r=>{
      const c=r.filter(Boolean);if(!c.length)return;
      if(c.every(x=>x.includes("@")))out.push({email:c.join(" ")});
      else if(r.length>=5)out.push({code:r[0],name:r[1],subject:r[2],station:r[3],email:r[4],remark:r[5]||""});
      else if((r[0]||"").includes("@"))out.push({email:r[0],remark:r[1]||""});
      else out.push({email:"",code:r[0],name:r[1]||"",subject:r[2]||""});
    });
    return out.filter(r=>Object.values(r).some(v=>String(v||"").trim()));
  }
  function buildImport(rows,defAir,defSubj){
    const map=new Map(),byCode=new Map(DB.emaildir.map(a=>[a.code,a.id]));
    const get=id=>{if(!map.has(id))map.set(id,cloneJ(DB.emaildir.find(a=>a.id===id)));return map.get(id)};
    const st={newAir:0,newSubj:0,newGrp:0,add:0,dup:0,bad:[]};
    rows.forEach(r=>{
      const code=(r.code||"").trim().toUpperCase();let a;
      if(code){if(byCode.has(code))a=get(byCode.get(code));else{const n={id:uid("al"),code,name:(r.name||"").trim()||(AIRNAMES[code]||"").split(" · ")[1]||code,subjects:[]};map.set(n.id,n);byCode.set(code,n.id);a=n;st.newAir++}}
      else if(defAir)a=get(defAir);
      else{st.bad.push(r.email||"(row without airline)");return}
      const sn=(r.subject||"").trim()||defSubj||"General Email",stn=(r.station||"").trim();
      let s=a.subjects.find(x=>x.name.toLowerCase()===sn.toLowerCase());
      if(!s){s=newSubject(sn,!!stn);a.subjects.push(s);st.newSubj++}
      let list;
      if(stn||s.grouped){
        if(!s.grouped){s.groups=(s.emails||[]).length?[{id:uid("g"),station:"General",emails:s.emails}]:[];s.emails=[];s.grouped=true}
        const gn=stn||"General";let g=s.groups.find(x=>x.station.toLowerCase()===gn.toLowerCase());
        if(!g){g={id:uid("g"),station:gn,emails:[]};s.groups.push(g);st.newGrp++}list=g.emails;
      }else list=s.emails;
      parseEmails(r.email||"").forEach(v=>{
        if(!EMAIL_RE.test(v)){st.bad.push(v);return}
        if(list.some(x=>x.addr.toLowerCase()===v.toLowerCase())){st.dup++;return}
        list.push({id:uid("m"),addr:v,remark:(r.remark||"").trim()});st.add++;
      });
    });
    return{map,st};
  }
  function importForm(){

      ["#im-t","#im-sub"].forEach(x=>$(x,bg).addEventListener("input",pv));$("#im-air",bg).addEventListener("change",pv);
      $("#im-f",bg).onchange=async e=>{
        const f=e.target.files[0];if(!f)return;
        try{
          if(/\.xlsx?$/i.test(f.name)){
            if(!window.XLSX)await loadScript(["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"]);
            const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
            $("#im-t",bg).value=rows.map(r=>r.map(c=>String(c).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");
          }else $("#im-t",bg).value=(await f.text()).replace(/^\ufeff/,"");
        }catch(x){toast("Could not read this file");return}
        pv();
      };
      $("#im-ok",bg).onclick=()=>{if(!cur)return;const first=[...cur.map.keys()][0];cur.map.forEach(a=>putItem("emaildir",a));if(first&&!air(S.sel))S.sel=first;close();toast(`Imported ${cur.st.add} email(s) ✓`)};
    });
  }
  /* ---------- drag & drop: subjects and stations ---------- */
  let DRAG=null;
  const clrDz=()=>$$(".dz-before,.dz-after,.dz-into,.dragging",root).forEach(x=>x.classList.remove("dz-before","dz-after","dz-into","dragging"));
  function dropTarget(e){
    if(!DRAG)return null;
    if(DRAG.k==="subj"){const el=e.target.closest(".scardx");return el&&el.dataset.sid!==DRAG.sid?{el,type:"subj"}:null}
    let el=e.target.closest(".grp");if(el)return el.dataset.gid===DRAG.gid?null:{el,type:"grp"};
    el=e.target.closest(".scardx");return el&&el.dataset.grouped==="1"?{el,type:"into"}:null;
  }
  root.addEventListener("dragstart",e=>{
    const h=e.target.closest?.(".grab");if(!h)return;e.stopPropagation();
    DRAG={k:h.dataset.dk,sid:h.dataset.sid,gid:h.dataset.gid||""};
    e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","emaildir");
    const card=h.closest(DRAG.k==="subj"?".scardx":".grp");e.dataTransfer.setDragImage(card,16,16);setTimeout(()=>card.classList.add("dragging"),0);
  });
  root.addEventListener("dragover",e=>{
    const t=dropTarget(e);if(!t)return;e.preventDefault();
    $$(".dz-before,.dz-after,.dz-into",root).forEach(x=>x.classList.remove("dz-before","dz-after","dz-into"));
    if(t.type==="into")t.el.classList.add("dz-into");else{const r=t.el.getBoundingClientRect();t.el.classList.add(e.clientY<r.top+r.height/2?"dz-before":"dz-after")}
  });
  root.addEventListener("drop",e=>{
    const t=dropTarget(e);if(!t)return;e.preventDefault();
    const before=t.el.classList.contains("dz-before"),D=DRAG;DRAG=null;clrDz();
    mut(S.sel,a=>{
      if(D.k==="subj"){const i=a.subjects.findIndex(s=>s.id===D.sid),[mv]=a.subjects.splice(i,1),j=a.subjects.findIndex(s=>s.id===t.el.dataset.sid);a.subjects.splice(before?j:j+1,0,mv)}
      else{const src=getS(a,D.sid),gi=src.groups.findIndex(g=>g.id===D.gid),[g]=src.groups.splice(gi,1),dst=getS(a,t.el.dataset.sid);
        if(t.type==="into")dst.groups.push(g);else{const j=dst.groups.findIndex(x=>x.id===t.el.dataset.gid);dst.groups.splice(before?j:j+1,0,g)}}
    });
    toast("Moved ✓");
  });
  root.addEventListener("dragend",()=>{clrDz();DRAG=null});
  const qi=$("#ed-q",root);
  qi.addEventListener("input",()=>{S.q=qi.value;const v=visible();if(v.length&&!v.some(a=>a.id===S.sel))S.sel=v[0].id;drawList();drawBody()});
  qi.addEventListener("keydown",e=>{
    const v=visible();if(!v.length)return;const i=v.findIndex(a=>a.id===S.sel);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();S.sel=v[Math.max(0,Math.min(v.length-1,(i<0?-1:i)+(e.key==="ArrowDown"?1:-1)))].id;drawList();drawBody()}
    if(e.key==="Enter"){S.sel=(i>=0?v[i]:v[0]).id;drawList();drawBody()}
  });
  draw();
  return {refresh:draw,goto(p){if(p.air){S.q="";qi.value="";S.sel=p.air;draw();
    const el=p.eid?$(`[data-eid="${p.eid}"]`,root):p.sid?$(`[data-sid="${p.sid}"]`,root):null;
    if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2200)}}}};
}

/* ============ ROUTER / LAYOUT ============ */
const MOD={email:mountEmail,policy:mountPolicy,contact:mountContact,sorting:mountSorting,emaildir:mountEmailDir};
let VIEW={mode:"home",a:"email",b:"contact"};
let mounted={};
function refreshAll(){Object.values(mounted).forEach(m=>m.refresh());renderHomeKpi()}
function renderNav(){
  $("#nav").innerHTML=`<button class="btn ${VIEW.mode==="home"?"on":""}" data-v="home">🏠 Home</button>`+SECTIONS.map(s=>`<button class="btn ${VIEW.mode==="single"&&VIEW.a===s.id?"on":""}" data-s="${s.id}" draggable="true">${s.icon} ${s.short}</button>`).join("")+
  `<div class="sp"><span class="hint">↕ Drag a section button onto the page to split</span><button class="btn ${VIEW.mode==="split"?"on":""}" data-v="split" title="Show two sections side by side">⫿⫿ Split view</button>${VIEW.mode==="split"?`<select data-sel="a">${SECTIONS.map(s=>`<option value="${s.id}"${VIEW.a===s.id?" selected":""}>${s.short}</option>`).join("")}</select><span>＋</span><select data-sel="b">${SECTIONS.map(s=>`<option value="${s.id}"${VIEW.b===s.id?" selected":""}>${s.short}</option>`).join("")}</select>`:""}</div>`;
}
function renderHomeKpi(){const k=$("#kpis");if(k)k.innerHTML=`<div class="kpi"><b>${DB.templates.length}</b><span>Email templates</span></div><div class="kpi"><b>${DB.phone.length}</b><span>Phone records</span></div><div class="kpi"><b>${DB.office.length}</b><span>Office records</span></div><div class="kpi"><b>${DB.sorting.length}</b><span>Sorting bags</span></div>`}
function render(){
  renderNav();mounted={};const m=$("#main");
  if(VIEW.mode==="home"){
    m.innerHTML=`<div class="hero"><div><h1>Welcome 👋</h1><p>Central information center for baggage service operations of BFS ground handling airlines at Bangkok-Suvarnabhumi. Choose a section to begin, or use the Advance Search Bar above to find any topic.</p></div><div class="kpis" id="kpis"></div></div>
    <div class="cards">${SECTIONS.map(s=>`<button class="scard" data-s="${s.id}" draggable="true"><div class="i">${s.icon}</div><h3>${s.name}${s.soon?'<span class="soon">Updating later</span>':""}</h3><p>${s.desc}</p><div class="go">Open section →</div></button>`).join("")}<div class="scard add"><div class="i">➕</div><h3>More sections</h3><p>New sections can be added here in future.</p></div></div>`;
    renderHomeKpi();return;
  }
  const ids=VIEW.mode==="split"?[VIEW.a,VIEW.b]:[VIEW.a];
  m.innerHTML=`<div class="${VIEW.mode==="split"?"split":""}">${ids.map((id,i)=>`<section class="pane" data-pane="${i}"></section>`).join("")}</div>`;
  ids.forEach((id,i)=>{mounted[id+"#"+i]=MOD[id]($(`[data-pane="${i}"]`,m))});
}
function apiFor(id){return Object.entries(mounted).find(([k])=>k.startsWith(id+"#"))?.[1]}
function go(id,payload){
  const visible=VIEW.mode==="split"&&(VIEW.a===id||VIEW.b===id);
  if(!visible){VIEW.mode="single";VIEW.a=id;render()}
  window.scrollTo({top:0,behavior:"smooth"});
  if(payload)apiFor(id)?.goto(payload);
}
$("#nav").addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"),s=e.target.closest("[data-s]");
  if(v){VIEW.mode=v.dataset.v;if(VIEW.mode==="split"&&VIEW.a===VIEW.b)VIEW.b=SECTIONS.find(x=>x.id!==VIEW.a).id;render()}
  if(s){VIEW.mode="single";VIEW.a=s.dataset.s;render()}
});
$("#nav").addEventListener("change",e=>{const k=e.target.dataset.sel;if(k){VIEW[k]=e.target.value;render()}});
$("#main").addEventListener("click",e=>{const s=e.target.closest(".scard[data-s]");if(s){VIEW.mode="single";VIEW.a=s.dataset.s;render()}});
$("#brand").onclick=()=>{VIEW.mode="home";render()};

/* ============ DRAG & DROP SPLIT ============ */
let dragId=null;
function placeSection(slot,id){
  if(VIEW.mode!=="split"){
    const cur=VIEW.mode==="single"?VIEW.a:null,other=cur&&cur!==id?cur:SECTIONS.find(s=>s.id!==id).id;
    if(slot==="a"){VIEW.a=id;VIEW.b=other}else{VIEW.b=id;VIEW.a=other}VIEW.mode="split";
  }else{const o=slot==="a"?"b":"a";if(VIEW[o]===id)VIEW[o]=VIEW[slot];VIEW[slot]=id}
  render();
}
function secName(id){return SECTIONS.find(s=>s.id===id)?.short||""}
function showZones(){
  if(!dragId||$("#dz"))return;const dz=document.createElement("div");dz.id="dz";
  const cur=s=>VIEW.mode==="split"?`Replace: ${secName(VIEW[s])}`:(VIEW.mode==="single"&&s==="a"?`Current: ${secName(VIEW.a)}`:"");
  dz.innerHTML=["a","b"].map(s=>`<div class="dzone" data-slot="${s}"><div>${s==="a"?"⬅ Left pane":"Right pane ➡"}</div><small>Drop <b>${esc(secName(dragId))}</b> here${cur(s)?" · "+esc(cur(s)):""}</small></div>`).join("");
  $("#main").appendChild(dz);
}
function hideZones(){$("#dz")?.remove();dragId=null}
document.addEventListener("dragstart",e=>{const s=e.target.closest?.("[data-s]");if(!s)return;dragId=s.dataset.s;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move";setTimeout(showZones,0)});
document.addEventListener("dragend",hideZones);
document.addEventListener("dragover",e=>{if(e.target.closest?.(".dzone"))e.preventDefault()});
document.addEventListener("dragenter",e=>{const z=e.target.closest?.(".dzone");$$(".dzone").forEach(x=>x.classList.toggle("over",x===z))});
document.addEventListener("drop",e=>{const z=e.target.closest?.(".dzone");if(!z)return;e.preventDefault();const id=dragId||e.dataTransfer.getData("text/plain");hideZones();if(SECTIONS.some(s=>s.id===id))placeSection(z.dataset.slot,id)});

/* ============ GLOBAL ADVANCE SEARCH ============ */
function buildIndex(){
  const ix=[];
  SECTIONS.forEach(s=>ix.push({sec:s.id,secName:s.short,title:s.name,sub:s.desc,crumb:"Section",text:(s.name+" "+s.desc+" "+s.kw).toLowerCase(),go:()=>go(s.id)}));
  DB.templates.forEach(t=>ix.push({sec:"email",secName:"Email Templates",title:t.titleEn+(t.titleTh?" · "+t.titleTh:""),sub:(t.subject?"Subject: "+t.subject+" — ":"")+t.en.replace(/\s+/g," ").slice(0,110),crumb:`Email Templates › ${airLabel(t.airline)} › ${t.type}`,text:[t.airline,airLabel(t.airline),t.type,t.aud,t.titleEn,t.titleTh,t.subject,t.en,t.th].join(" ").toLowerCase(),go:()=>go("email",{tpl:t.id})}));
  ["phone","office"].forEach(k=>DB[k].forEach(r=>ix.push({sec:"contact",secName:"Contact History",title:`${r.ref||"(no case ref)"} — ${r.topic}`,sub:`${r.contact?r.contact+" · ":""}${r.status} · ${r.remark||""}`.slice(0,120),crumb:`Contact History › ${CFG[k].label} › ${fmt(r.ts)}`,text:[r.ref,r.contact,r.topic,r.rtype,r.remark,r.status,CFG[k].label,"contact history"].join(" ").toLowerCase(),go:()=>go("contact",{tab:k,q:r.ref||r.contact||""})})));
  DB.sorting.filter(r=>!isMockRec(r)).forEach(r=>{const cm=(r.history||[]).filter(x=>/^(Comment|Note):/.test(x.text)).map(x=>x.text);ix.push({sec:"sorting",secName:"Sorting Bag Record",title:`${r.tagNumber} — ${r.flightNumber} (${r.flightDate})`,sub:`${r.color||""} · ${r.status} · AHL/Email: ${r.ahlCase||"—"}${cm.length?" · "+cm[cm.length-1]:""}`.slice(0,140),crumb:`Sorting Bag Record › Dashboard › ${r.createdAt||""}`,text:[r.tagNumber,r.flightNumber,r.flightDate,r.color,r.ahlCase,r.status,(r.history||[]).map(x=>x.text).join(" "),"sorting bag record tbt"].join(" ").toLowerCase(),go:()=>go("sorting",{q:r.tagNumber})})});
  DB.emaildir.forEach(a=>{const at=airTitle(a),pd=policyFor(a).doc;
    pd.cards.forEach(c=>ix.push({sec:"policy",secName:"Airlines Policy",title:`${a.code} · ${c.title}`,sub:cardText(c).replace(/\s+/g," ").slice(0,130)||"(empty)",crumb:`Airlines Policy › ${at} › ${c.title}`,text:["airlines policy",at,c.title,cardText(c),pd.note].join(" ").toLowerCase(),go:()=>go("policy",{air:a.id,cid:c.id})}));
    if(pd.note)ix.push({sec:"policy",secName:"Airlines Policy",title:`${a.code} · mention`,sub:pd.note,crumb:`Airlines Policy › ${at}`,text:["airlines policy",at,pd.note].join(" ").toLowerCase(),go:()=>go("policy",{air:a.id})});
    ix.push({sec:"emaildir",secName:"Email Directory",title:at,sub:`${a.subjects.length} subject(s)`,crumb:"Email Directory › Airline",text:("email directory "+at).toLowerCase(),go:()=>go("emaildir",{air:a.id})});
    a.subjects.forEach(s=>{
      ix.push({sec:"emaildir",secName:"Email Directory",title:s.name,sub:s.note||`${uniqAddr(listEmails(s)).length} email(s)`,crumb:`Email Directory › ${at} › Subject`,text:["email directory",at,s.name,s.note].join(" ").toLowerCase(),go:()=>go("emaildir",{air:a.id,sid:s.id})});
      (s.grouped?(s.groups||[]).map(g=>[g.station,g.emails||[]]):[["",s.emails||[]]]).forEach(([st,l])=>l.forEach(e=>ix.push({sec:"emaildir",secName:"Email Directory",title:e.addr,sub:(e.remark?e.remark+" · ":"")+s.name,crumb:`Email Directory › ${at} › ${s.name}${st?" › "+st:""}`,text:["email directory",at,s.name,st,e.addr,e.remark].join(" ").toLowerCase(),go:()=>go("emaildir",{air:a.id,eid:e.id})})));
    })});
  return ix;
}
let gItems=[],gAct=-1,gScope="",gLimit=40;
const gq=$("#gq"),gres=$("#gres"),G_PH=gq.placeholder,RK="bfs-recent-search";
const recents=()=>{try{return JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){return[]}};
function addRecent(q){q=q.trim();if(q.length<2)return;try{localStorage.setItem(RK,JSON.stringify([q,...recents().filter(x=>x!==q)].slice(0,6)))}catch(e){}}
function chipsHTML(counts,total){return `<span class="hint">Search in:</span><button class="gchip ${gScope?"":"on"}" data-sc="">All <b>${total}</b></button>`+SECTIONS.map(s=>`<button class="gchip ${gScope===s.id?"on":""}" data-sc="${s.id}">${s.icon} ${esc(s.short)} <b>${counts[s.id]||0}</b></button>`).join("")}
function gsearch(){
  const q=gq.value.trim().toLowerCase(),idx=buildIndex(),counts={};
  gq.placeholder=gScope?`Search in ${SECTIONS.find(s=>s.id===gScope).short}…`:G_PH;
  if(q.length<2){
    idx.forEach(i=>counts[i.sec]=(counts[i.sec]||0)+1);gItems=[];gAct=-1;const rc=recents();
    gres.innerHTML=`<div class="gh">${chipsHTML(counts,idx.length)}</div><div style="padding:12px 14px;color:var(--mut);font-size:13px">Type at least 2 characters.${gScope?"":" Tip: pick a section above to search only inside it."}</div>`+(rc.length?`<div class="edh" style="padding:4px 14px">Recent searches</div>`+rc.map(r=>`<div class="it" data-rc="${esc(r)}">🕘 ${esc(r)}</div>`).join(""):"");
    gres.classList.add("on");return;
  }
  const w=q.split(/\s+/);
  const hit=idx.map(i=>{if(!w.every(x=>i.text.includes(x)))return null;const t=i.title.toLowerCase();return{i,s:(t.startsWith(q)?5:t.includes(q)?4:w.some(x=>t.includes(x))?3:1)+(i.crumb==="Section"?1:0)}}).filter(Boolean);
  hit.forEach(h=>counts[h.i.sec]=(counts[h.i.sec]||0)+1);
  const list=hit.filter(h=>!gScope||h.i.sec===gScope).sort((a,b)=>b.s-a.s).map(h=>h.i);
  gItems=list;gAct=-1;const shown=list.slice(0,gLimit);
  gres.innerHTML=`<div class="gh">${chipsHTML(counts,hit.length)}</div>`+(shown.length?shown.map((it,n)=>`<div class="it" data-n="${n}"><div class="t"><span class="src s-${it.sec}">${esc(it.secName)}</span>${hl(it.title,q)}</div><div class="crumb">📍 ${esc(it.crumb)}</div><div class="s">${hl(it.sub,q)}</div></div>`).join("")+(list.length>shown.length?`<div class="it" data-more="1" style="text-align:center;color:var(--pri);font-weight:600">Show more (${list.length-shown.length} left)</div>`:""):`<div class="empty">No results for “${esc(gq.value)}”${gScope?" in this section":""}.</div>`);
  gres.classList.add("on");
}
gq.addEventListener("input",()=>{gLimit=40;gsearch()});gq.addEventListener("focus",gsearch);
gq.addEventListener("keydown",e=>{
  const its=$$(".it",gres);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();gAct=Math.max(0,Math.min(its.length-1,gAct+(e.key==="ArrowDown"?1:-1)));its.forEach((x,n)=>x.classList.toggle("act",n===gAct));its[gAct]?.scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"){e.preventDefault();const el=its[gAct];
    if(el?.dataset.rc){gq.value=el.dataset.rc;gsearch()}else if(el?.dataset.more){gLimit+=40;gsearch()}else if(gItems.length)pick(el?+el.dataset.n:0)}
  if(e.key==="Escape"){gres.classList.remove("on");gq.blur()}
});
function pick(n){const it=gItems[n];addRecent(gq.value);gres.classList.remove("on");it?.go()}
gres.addEventListener("mousedown",e=>{
  const sc=e.target.closest("[data-sc]");if(sc){e.preventDefault();gScope=sc.dataset.sc;gLimit=40;gsearch();return}
  const rc=e.target.closest("[data-rc]");if(rc){e.preventDefault();gq.value=rc.dataset.rc;gLimit=40;gsearch();return}
  if(e.target.closest("[data-more]")){e.preventDefault();gLimit+=40;gsearch();return}
  const it=e.target.closest(".it[data-n]");if(it){e.preventDefault();pick(+it.dataset.n)}
});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))gres.classList.remove("on")});

$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark"};
render();
initCloud();
